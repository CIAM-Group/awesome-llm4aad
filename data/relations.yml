# Directed relations always run from the earlier paper (`from`) to the later paper (`to`).
# `concurrent-work` is undirected and appears as a dashed line on the website.
relations:
  - from: ael
    to: funsearch
    type: concurrent-work
    dimension: historical
    description: >-
      AEL and FunSearch independently established LLM-guided evolutionary search
      for algorithm or program design in late 2023.
  - from: ael
    to: eoh
    type: extends
    dimension: design-object
    description: >-
      EoH extends algorithm evolution with a joint representation of
      natural-language ideas and executable heuristic code.
  - from: eoh
    to: reevo
    type: contrasts
    dimension: feedback
    description: >-
      ReEvo takes a reflective hyper-heuristic path, using short- and long-term
      verbal feedback instead of EoH's explicit thought-and-code representation.
  - from: eoh
    to: mcts-ahd
    type: contrasts
    dimension: search
    description: >-
      MCTS-AHD preserves heuristic lineages in a tree instead of relying on a
      fixed elite population.
  - from: reevo
    to: hsevo
    type: evaluated-by
    dimension: search
    description: >-
      HSEvo studies the gap between ReEvo's objective quality and search-space
      diversity.
  - from: eoh
    to: eoh-s
    type: generalizes
    dimension: scope
    description: >-
      EoH-S changes the output from one heuristic to a complementary set that
      covers varied instance distributions.
  - from: funsearch
    to: alphaevolve
    type: generalizes
    dimension: scope
    description: >-
      AlphaEvolve broadens evaluator-guided program evolution into a coding-agent
      system for scientific and infrastructure tasks.
  - from: funsearch
    to: hsevo
    type: evaluated-by
    dimension: search
    description: >-
      HSEvo includes FunSearch in its analysis of diversity and convergence in
      evolutionary program search.
  - from: eoh
    to: instspechh
    type: generalizes
    dimension: scope
    description: >-
      InstSpecHH moves beyond a single class-wide heuristic by partitioning
      instances into subclasses, evolving a heuristic per subclass, and selecting
      online for the target instance.
  - from: eoh-s
    to: raise
    type: contrasts
    dimension: scope
    description: >-
      RAISE addresses distributional robustness with constrained adversarial
      instance search, instead of relying on a complementary heuristic set
      trained on predefined diverse distributions.
  - from: eoh
    to: redahd
    type: generalizes
    dimension: scope
    description: >-
      RedAHD uses EoH as an underlying LLM-EPS method and adds language
      reductions so heuristic design can operate without manually specified
      generalized algorithmic frameworks.
  - from: eoh
    to: meoh
    type: generalizes
    dimension: scope
    description: >-
      MEoH extends EoH's single-objective heuristic evolution to a
      multi-objective search that returns non-dominated heuristics across
      solution quality and runtime.
  - from: reevo
    to: ahd-eval
    type: evaluated-by
    dimension: search
    description: >-
      The EPS benchmark re-evaluates ReEvo under shared tasks, models, budgets, and
      repeated runs as part of its evolutionary-search analysis.
  - from: funsearch
    to: ahd-eval
    type: evaluated-by
    dimension: search
    description: >-
      The EPS benchmark compares FunSearch with other LLM-based evolutionary program
      search methods under a common experimental protocol.
  - from: funsearch
    to: behavesim
    type: extends
    dimension: search
    description: >-
      BehaveSim is integrated into FunSearch to select behaviorally diverse
      programs using aligned problem-solving trajectories.
  - from: ceoh
    to: a-ceoh
    type: adapts
    dimension: feedback
    description: >-
      CEoH supplies problem-specific context; A-CEoH adapts this idea by exposing
      the host A* implementation so generated heuristics can reason about how they
      interact with the search procedure.
  - from: reevo
    to: poh
    type: extends
    dimension: search
    description: >-
      PoH turns reflective improvement suggestions into actions in an MCTS plan,
      adding lookahead and backpropagated rewards to ReEvo-style iterative
      reflection.
  - from: calm
    to: aad-ft
    type: contrasts
    dimension: feedback
    description: >-
      CALM updates the generator online with rewards produced during evolution,
      whereas AAD Fine-tuning learns offline from diversity-aware ranked preference
      pairs and then reuses the adapted model in search.
  - from: alphaevolve
    to: shinkaevolve
    type: adapts
    dimension: search
    description: >-
      ShinkaEvolve retains island-based program evolution while targeting far fewer
      evaluations through novelty rejection, LLM prioritization, and an online
      meta-scratchpad.
  - from: hsevo
    to: heurigym
    type: evaluated-by
    dimension: scope
    description: >-
      HeuriGym evaluates HSEvo in an agentic setting where models must build
      complete optimization programs, exposing the limits of template-bound
      heuristic evolution on broader solver-design tasks.
  - from: hsevo
    to: tide
    type: extends
    dimension: search
    description: >-
      TIDE moves HSEvo's post-hoc elite parameter tuning inside the evolutionary
      loop and couples it with AST-level diversity control and adaptive prompt
      scheduling.
  - from: hsevo
    to: cdeoh
    type: contrasts
    dimension: search
    description: >-
      HSEvo measures diversity through encoded representations and clustering;
      CDEoH instead asks an LLM to induce semantic algorithm categories and
      preserves coverage during population selection.
  - from: calm
    to: dyace
    type: contrasts
    dimension: design-object
    description: >-
      CALM co-evolves the language model that proposes heuristics, while DyACE
      keeps the generator fixed and redesigns search operators online from observed
      solution-landscape trajectories.
  - from: optibench
    to: equivamap
    type: extends
    dimension: feedback
    description: >-
      EquivaMap strengthens formulation evaluation beyond OptiBench-style execution
      outcomes by generating and verifying mappings between alternative variable
      spaces.
  - from: reevo
    to: meevo
    type: extends
    dimension: feedback
    description: >-
      MeEvo promotes reflection from an auxiliary signal into an alternating
      metacognitive process whose reasoning traces are preserved as heritable design
      knowledge between population-evolution cycles.
  - from: reevo
    to: lhs
    type: contrasts
    dimension: search
    description: >-
      ReEvo refines discrete code candidates with verbal reflection, whereas LHS
      learns a continuous program manifold and optimizes soft prompts before
      decoding them into executable heuristics.
  - from: eoh-s
    to: ast-evo
    type: adapts
    dimension: search
    description: >-
      The AST operator replaces EoH-S's validity-preserving variation with
      structural crossover and mutation that may produce invalid code, then uses
      the LLM to repair those candidates back into executable heuristics.
  - from: alphaevolve
    to: codegraph
    type: extends
    dimension: design-object
    description: >-
      Code Graph makes edit-level search compositional: unlike AlphaEvolve's edits,
      its corrections remain reusable and toggleable, enabling correction-level
      credit assignment and multiple programs per query.
  - from: mcts-ahd
    to: a2dept
    type: generalizes
    dimension: design-object
    description: >-
      A2DEPT generalizes tree-structured search from bounded heuristic components to
      complete solver programs, adding hierarchical edits and dependency repair to
      keep long-horizon branches executable.
  - from: a2dept
    to: beam
    type: concurrent-work
    dimension: historical
    description: >-
      A2DEPT and BEAM independently move beyond single-function design in April
      2026: one evolves complete programs in a search tree, while the other splits
      solver structure and function realization across two levels.
  - from: alphaevolve
    to: harnesseng
    type: contrasts
    dimension: design-object
    description: >-
      Vesper shifts attention from AlphaEvolve-style stateless code edits to the
      discovery harness itself, using persistent coding agents, repository-level
      branches, history queries, and evaluation-hack detection.
