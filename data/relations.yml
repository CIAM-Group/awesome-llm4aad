# Directed relations always run from the earlier paper (`from`) to the later paper (`to`).
# `concurrent-work` is undirected and appears as a dashed line on the website.
# Every paper must participate in at least one relation. Add further links only
# when the papers' methods, experiments, or explicit comparisons support them.
relations:
  - from: ael
    to: funsearch
    type: concurrent-work
    dimension: historical
    description: >-
      AEL and FunSearch independently established LLM-guided evolutionary search
      for algorithm or program design in late 2023.
  - from: ael
    to: eoh
    type: extends
    dimension: design-object
    description: >-
      EoH extends algorithm evolution with a joint representation of
      natural-language ideas and executable heuristic code.
  - from: eoh
    to: eoh-s
    type: generalizes
    dimension: scope
    description: >-
      EoH-S changes the output from one heuristic to a complementary set that
      covers varied instance distributions.
  - from: eoh
    to: ast-evo
    type: extends
    dimension: search
    description: >-
      The AST study replaces EoH's semantic crossover and mutation with structural
      AST disruption followed by LLM repair; it then evaluates this operator in EoH,
      ReEvo, and EoH-S rather than extending the heuristic-set objective itself.
  - from: funsearch
    to: alphaevolve
    type: generalizes
    dimension: scope
    description: >-
      AlphaEvolve broadens evaluator-guided program evolution into a coding-agent
      system for scientific and infrastructure tasks.
  - from: alphaevolve
    to: shinkaevolve
    type: adapts
    dimension: search
    description: >-
      ShinkaEvolve retains island-based program evolution while targeting fewer
      evaluations through novelty rejection, prioritization, and a meta-scratchpad.
  - from: reevo
    to: poh
    type: extends
    dimension: search
    description: >-
      PoH turns ReEvo-style reflective suggestions into actions in an MCTS plan,
      adding lookahead and backpropagated rewards to iterative reflection.
  - from: poh
    to: mcts-ahd
    type: concurrent-work
    dimension: historical
    description: >-
      PoH and MCTS-AHD were contemporaneous tree-search approaches: one plans
      reflective actions, while the other preserves heuristic lineages as nodes.
  - from: mcts-ahd
    to: a2dept
    type: generalizes
    dimension: design-object
    description: >-
      A2DEPT expands tree-structured search from bounded heuristic components to
      complete solver programs with hierarchical edits and dependency repair.
  - from: mcts-ahd
    to: laf-mcts
    type: extends
    dimension: search
    description: >-
      LaF-MCTS applies hierarchical tree search to large-scale CVRP solver design,
      extending the tree-search formulation established by MCTS-AHD.
  - from: hsevo
    to: partevo
    type: extends
    dimension: search
    description: >-
      PartEvo converts the diversity concern highlighted by HSEvo into explicit
      feature-space niches with niche-level search-budget allocation.
  - from: cdeoh
    to: behavesim
    type: contrasts
    dimension: feedback
    description: >-
      CDEoH groups algorithms by semantic categories, whereas BehaveSim measures
      diversity from aligned problem-solving trajectories rather than code form.
  - from: ceoh
    to: a-ceoh
    type: adapts
    dimension: feedback
    description: >-
      CEoH supplies problem-specific context; A-CEoH exposes the surrounding A*
      implementation so generated heuristics can reason about their host algorithm.
  - from: strongprior
    to: knowledgefirst
    type: extends
    dimension: feedback
    description: >-
      Knowledge-first design operationalizes strong priors as retrieved and
      structured domain knowledge that guides proposals before evaluation.
  - from: calm
    to: aad-ft
    type: contrasts
    dimension: feedback
    description: >-
      CALM updates the proposal model online from evolutionary rewards, whereas
      AAD Fine-tuning learns offline from diversity-aware preference pairs.
  - from: llmopt
    to: orlm
    type: contrasts
    dimension: design-object
    description: >-
      LLMOPT learns a shared representation for defining and solving problems;
      ORLM instead trains customizable models on synthesized OR instructions.
  - from: orlm
    to: equivamap
    type: extends
    dimension: feedback
    description: >-
      EquivaMap adds explicit variable mappings and verification for deciding
      whether alternative optimization formulations preserve the same problem.
  - from: optibench
    to: equivamap
    type: extends
    dimension: feedback
    description: >-
      EquivaMap complements outcome-based formulation evaluation with explicit
      variable mappings and structural checks of semantic equivalence.
  - from: eoh
    to: heurigym
    type: contrasts
    dimension: feedback
    description: >-
      HeuriGym broadens EoH-style heuristic evaluation into a shared agentic
      benchmark with separate generation, execution, and task-level scoring.
  - from: ars
    to: afl
    type: generalizes
    dimension: scope
    description: >-
      AFL expands automatic routing design from specializing a solver backbone to
      multi-agent construction and repair of complete constrained VRP solvers.
  - from: g-lns
    to: evolved-alns
    type: generalizes
    dimension: design-object
    description: >-
      Evolved-ALNS broadens generated neighborhood operators into joint evolution
      of the seven interacting modules of an adaptive LNS solver.
  - from: coupleevo
    to: coevo
    type: concurrent-work
    dimension: historical
    description: >-
      CoupleEvo and CoEvo independently study co-evolution for coupled optimization,
      using different representations and coordination mechanisms.
  - from: coevo
    to: stable
    type: generalizes
    dimension: design-object
    description: >-
      STABLE broadens paired component co-evolution into semantics-aware bilevel
      design for reusable multicomponent algorithms.
  - from: eoh-s
    to: raise
    type: contrasts
    dimension: scope
    description: >-
      RAISE targets robust generalization by actively searching adversarial
      instances, whereas EoH-S evaluates complementarity over a fixed diverse pool.
  - from: eoh
    to: autoport
    type: adapts
    dimension: scope
    description: >-
      AutoPort adapts executable heuristic evolution to joint antenna-port selection
      and beamforming under communication-system constraints.
  - from: eoh
    to: llamea-hpo
    type: extends
    dimension: search
    description: >-
      LLaMEA-HPO separates LLM-generated algorithm structure from numerical
      hyper-parameter tuning performed inside the evolutionary loop.
  - from: eoh
    to: teacherevo
    type: extends
    dimension: feedback
    description: >-
      Teacher-Aware evolution adds behavioral guidance from learned optimization
      policies to EoH-like heuristic program search.
  - from: eoh
    to: redahd
    type: extends
    dimension: design-object
    description: >-
      RedAHD builds on EoH-family evolutionary heuristic search while replacing the
      manually supplied algorithm framework with LLM-generated problem reductions.
  - from: eoh
    to: mths
    type: generalizes
    dimension: scope
    description: >-
      MTHS generalizes within-task heuristic evolution into a cross-task hierarchy
      with shared metaheuristics and task-specific executable programs.
  - from: eoh
    to: beam
    type: generalizes
    dimension: design-object
    description: >-
      BEAM expands the design object into a bilevel solver structure, separating
      high-level architecture search from function-level realization.
  - from: eoh
    to: codegraph
    type: extends
    dimension: design-object
    description: >-
      Code Graph replaces whole-candidate inheritance with reusable code subgraphs
      that preserve corrections and partial algorithmic structure across proposals.
  - from: llm-sr
    to: lhs
    type: contrasts
    dimension: search
    description: >-
      LLM-SR searches discrete scientific programs with language-model priors,
      whereas LHS optimizes programs through a learned continuous latent manifold.
  - from: llm4ad-platform
    to: enhancing-cvrp
    type: adapts
    dimension: scope
    description: >-
      AILS-AHD instantiates the platform-style separation of search, task, and
      evaluation modules for ruin-heuristic design inside a CVRP solver.
  - from: eoh
    to: llamea-bo
    type: adapts
    dimension: design-object
    description: >-
      LLaMEA-BO adapts LLM-driven evolutionary design from heuristic functions to
      complete Bayesian optimization algorithm programs.
  - from: eoh
    to: beyond-algorithm-evolution
    type: extends
    dimension: feedback
    description: >-
      Beyond Algorithm Evolution makes the prompt strategy a co-evolving artifact
      alongside the optimization algorithm rather than a fixed search instruction.
  - from: codeevolve
    to: mutation-without-variation
    type: contrasts
    dimension: search
    description: >-
      CodeEvolve combines archives and several LLM variation operators; Mutation
      Without Variation isolates repeated mutation to expose structural attractors.
  - from: reevo
    to: reflex
    type: extends
    dimension: feedback
    description: >-
      REFLEX extends reflective program evolution with visual diagnosis, separated
      code synthesis, and persistent experience memory.

  # Additional lineage links. These give later papers a second, method-specific
  # connection while allowing foundational work to act as a graph hub.
  - from: eoh
    to: ahd-eval
    type: contrasts
    dimension: search
    description: >-
      The EPS benchmark makes evolutionary search itself the design variable, in
      contrast to EoH's coupled proposal-and-selection workflow.
  - from: eoh
    to: reevo
    type: extends
    dimension: feedback
    description: >-
      ReEvo augments evolutionary heuristic generation with short- and long-term
      reflective feedback distilled from comparisons between candidate programs.
  - from: eoh
    to: llm4ad-platform
    type: generalizes
    dimension: scope
    description: >-
      LLM4AD turns the EoH workflow into reusable interfaces for methods, problems,
      evaluators, and language models rather than one fixed experiment pipeline.
  - from: eoh
    to: hsevo
    type: contrasts
    dimension: search
    description: >-
      HSEvo takes a diversity-oriented search route, using harmony-search memory and
      genetic variation where EoH relies on language-model evolutionary operators.
  - from: eoh
    to: meoh
    type: generalizes
    dimension: scope
    description: >-
      MEoH replaces single-objective fitness with Pareto-based evolution so the
      generated heuristics can trade solution quality against computational cost.
  - from: eoh
    to: ceoh
    type: extends
    dimension: feedback
    description: >-
      CEoH injects explicit problem context into the proposal loop, helping the
      model reason about unfamiliar optimization structures before writing code.
  - from: eoh
    to: instspechh
    type: generalizes
    dimension: scope
    description: >-
      InstSpecHH moves from one broadly optimized heuristic to generation and
      selection of specialized heuristics for different instance clusters.
  - from: eoh
    to: heuragenix
    type: generalizes
    dimension: scope
    description: >-
      HeurAgenix expands EoH-style heuristic generation into a portfolio whose
      members are selected online from the current solver state.
  - from: eoh
    to: efficient-heuristics
    type: extends
    dimension: feedback
    description: >-
      Hercules adds elite-structure abstraction and efficiency-oriented feedback
      to iterative LLM heuristic generation.
  - from: eoh
    to: dash
    type: extends
    dimension: feedback
    description: >-
      DASH replaces endpoint-only heuristic scoring with convergence-trajectory
      and runtime profiling to design specialized solver behavior.
  - from: eoh
    to: tide
    type: extends
    dimension: search
    description: >-
      TIDE adds an inner continuous parameter-tuning loop to EoH-style structural
      evolution instead of asking the LLM to optimize both at once.
  - from: eoh
    to: dyace
    type: generalizes
    dimension: scope
    description: >-
      DyACE moves heuristic evolution from a pre-deployment phase into the active
      solution search, redesigning heuristics from observed trajectory features.
  - from: eoh
    to: hmace
    type: extends
    dimension: feedback
    description: >-
      HMACE distributes proposal, critique, and memory across heterogeneous agents
      while retaining population-based heuristic evolution.
  - from: eoh
    to: strongprior
    type: contrasts
    dimension: feedback
    description: >-
      Strong Priors tests EoH-family search under richer initial algorithmic
      scaffolds and shows how prior structure changes the value of LLM evolution.
  - from: reevo
    to: calm
    type: extends
    dimension: feedback
    description: >-
      CALM goes beyond textual reflection by updating the proposal model itself
      from evolutionary rewards, coupling model learning with algorithm search.
  - from: reevo
    to: pyvrp-plus
    type: adapts
    dimension: feedback
    description: >-
      PyVRP+ adapts reflective heuristic evolution to a production hybrid genetic
      search, separating diagnosis, hypothesis formation, and code revision.
  - from: reevo
    to: mles
    type: generalizes
    dimension: feedback
    description: >-
      MLES broadens reflection beyond scalar and textual signals by using rendered
      behavior as multimodal feedback for evolving control programs.
  - from: reevo
    to: meevo
    type: extends
    dimension: feedback
    description: >-
      MeEvo makes reflective reasoning heritable across generations and combines it
      with a separate natural-evolution population process.
  - from: calm
    to: ahd-agent
    type: contrasts
    dimension: feedback
    description: >-
      CALM learns the proposal model from evolutionary rewards, whereas AHD Agent
      trains a multi-turn policy for deciding when to inspect, design, and evaluate.
  - from: mcts-ahd
    to: cogmcts
    type: extends
    dimension: search
    description: >-
      CogMCTS adds cognitive guidance and explicit use of failed search experience
      to the lineage-preserving tree search introduced for heuristic evolution.
  - from: mcts-ahd
    to: pathwise
    type: extends
    dimension: search
    description: >-
      PathWise enriches tree-structured planning with a learned world model and
      routed critics that estimate the consequences of design actions.
  - from: meoh
    to: e2oc
    type: generalizes
    dimension: design-object
    description: >-
      E2OC moves multi-objective evolution from selecting whole heuristics to
      jointly designing interdependent operators inside a multi-objective solver.
  - from: funsearch
    to: llm-sr
    type: adapts
    dimension: design-object
    description: >-
      LLM-SR adapts evaluator-guided program search to scientific equation
      discovery, using executable programs as structured symbolic expressions.
  - from: funsearch
    to: codeevolve
    type: generalizes
    dimension: scope
    description: >-
      CodeEvolve generalizes evaluator-driven program evolution into an open coding
      agent with archives, multiple variation operators, and task-defined harnesses.
  - from: alphaevolve
    to: codeevolve
    type: adapts
    dimension: search
    description: >-
      CodeEvolve provides an open implementation of coding-agent evolution with
      configurable archives and operators for reproducible algorithm discovery.
  - from: alphaevolve
    to: cliffsearch
    type: extends
    dimension: design-object
    description: >-
      CliffSearch co-evolves theoretical explanations with code and uses reviewers
      to gate both artifacts, extending discovery beyond executable candidates.
  - from: alphaevolve
    to: harnesseng
    type: contrasts
    dimension: feedback
    description: >-
      Vesper studies the harness around coding agents as a primary design variable,
      showing how persistent branches and evaluation structure affect discovery.
  - from: eoh
    to: autosg
    type: generalizes
    dimension: scope
    description: >-
      AutoSG broadens heuristic generation into executable solver construction from
      task prompts under expensive black-box evaluation.
  - from: eoh
    to: ahd-network
    type: adapts
    dimension: scope
    description: >-
      AHD-Network adapts LLM-based heuristic design to noisy production constraints
      in 5G decoding, where each candidate requires costly system evaluation.
  - from: eoh
    to: ars
    type: adapts
    dimension: scope
    description: >-
      ARS transfers LLM-guided heuristic design into an end-to-end routing solver
      with retrieved constraint knowledge and executable evaluation.
  - from: llm4ad-platform
    to: llmopt
    type: generalizes
    dimension: design-object
    description: >-
      LLMOPT broadens platform-style algorithm design from heuristic components to
      jointly defining and solving general optimization models.
  - from: eoh
    to: g-lns
    type: adapts
    dimension: design-object
    description: >-
      G-LNS adapts executable heuristic evolution to a paired destroy-and-repair
      neighborhood mechanism for large-neighborhood search.
  - from: eoh
    to: cdeoh
    type: extends
    dimension: search
    description: >-
      CDEoH retains EoH's thought-code representation but reorganizes the population
      around semantic categories to preserve conceptual search coverage.
  - from: eoh
    to: coupleevo
    type: generalizes
    dimension: design-object
    description: >-
      CoupleEvo broadens EoH from one generated heuristic to cooperating heuristics
      for coupled optimization components.
  - from: eoh
    to: mles
    type: adapts
    dimension: design-object
    description: >-
      MLES explicitly uses an EoH-style evolutionary backbone, then adapts the
      thought-code loop to executable control policies for visual environments.
  - from: eoh
    to: partevo
    type: extends
    dimension: search
    description: >-
      PartEvo directly retains EoH's thought-code representation while adding
      feature-space niches and explicit search-budget allocation.
  - from: funsearch
    to: partevo
    type: extends
    dimension: search
    description: >-
      PartEvo replaces FunSearch's random-island diversity mechanism with
      feature-based niche construction and niche-level resource allocation.
  - from: reevo
    to: partevo
    type: extends
    dimension: feedback
    description: >-
      PartEvo inherits and extends ReEvo's language-gradient feedback for
      deciding which weaknesses should guide the next proposal.
  - from: eoh
    to: pathwise
    type: extends
    dimension: search
    description: >-
      PathWise extends EoH's population-based search with entailment-graph state,
      planning actions, and structured interactions between candidate ideas.
  - from: reevo
    to: pathwise
    type: extends
    dimension: feedback
    description: >-
      PathWise replaces ReEvo's static single-level reflection with policy and
      world-model critics whose feedback is stored in a structured graph memory.
  - from: coupleevo
    to: stable
    type: concurrent-work
    dimension: design-object
    description: >-
      CoupleEvo and STABLE address multicomponent coordination around the same
      period, with CoupleEvo studying coupled heuristics and STABLE using semantic
      bilevel component search; the accepted-version dates overlap the same line.
  - from: e2oc
    to: stable
    type: generalizes
    dimension: design-object
    description: >-
      STABLE generalizes E2OC's interdependent operator coordination to bilevel
      design of broader multicomponent algorithm structures.
  - from: reevo
    to: lhs
    type: contrasts
    dimension: search
    description: >-
      LHS takes a continuous learned latent-manifold route for program search,
      contrasting with ReEvo's discrete code mutations and verbal reflection.
  - from: mcts-ahd
    to: lhs
    type: contrasts
    dimension: search
    description: >-
      LHS replaces the tree-structured heuristic lineage used by MCTS-AHD with
      latent-space optimization of executable programs.
  - from: funsearch
    to: behavesim
    type: adapts
    dimension: feedback
    description: >-
      BehaveSim adapts evolutionary program discovery with trajectory-level
      behavior feedback, adding a diversity signal beyond FunSearch's scores.
  - from: eoh-s
    to: ast-evo
    type: adapts
    dimension: search
    description: >-
      AST-Evo modifies the variation operator inside EoH-S by combining AST
      crossover or mutation with LLM repair; it does not change the set objective.
  - from: aad-ft
    to: ahd-agent
    type: contrasts
    dimension: feedback
    description: >-
      AHD Agent uses an explicit multi-turn tool policy, contrasting with AAD
      Fine-tuning's offline generator updates from candidate-quality preferences.
  - from: eoh
    to: knowledgefirst
    type: contrasts
    dimension: design-object
    description: >-
      Knowledge-first inverts EoH's thought-code balance: code becomes an
      experiment for evolving domain knowledge rather than a co-equal search object.
  - from: alphaevolve
    to: dgm
    type: concurrent-work
    dimension: historical
    description: >-
      AlphaEvolve and DGM appeared in the same research period but pursue different
      coding-agent goals: scientific algorithm discovery versus self-modifying agents.
  - from: or-survey
    to: qp-adapt
    type: contextualizes
    dimension: scope
    description: >-
      The OR survey provides context for the VVenC study's LLM-generated
      rate-distortion heuristics in a production video encoder.
  - from: alphaevolve
    to: domain-heuristics
    type: contextualizes
    dimension: scope
    description: >-
      The planning study is a neighboring OpenEvolve route that evolves MAP-Elites
      C++ heuristics for transfer across symbolic-planning domains.
  - from: ahd-survey
    to: successor-heuristics
    type: contextualizes
    dimension: design-object
    description: >-
      The AHD survey provides context for Successor-Generator's problem-level
      LLM-synthesized heuristic and planner integration.
  - from: reevo
    to: trajevo
    type: contextualizes
    dimension: feedback
    description: >-
      TrajEvo is a neighboring LLM-plus-evolution route for trajectory prediction;
      its cross-generation sampling and statistics feedback are task-specific.
  - from: funsearch
    to: mech-design
    type: adapts
    dimension: scope
    description: >-
      The mechanism-design framework uses FunSearch-style evolution for allocation
      rules and adds strategy-proofness repair for a new design domain.
  - from: eoh
    to: autopbo
    type: contrasts
    dimension: design-object
    description: >-
      AutoPBO explicitly contrasts direct EoH-style generation with multi-agent
      optimization of an existing PBO solver and its local-search components.
  - from: funsearch
    to: feynman-funsearch
    type: adapts
    dimension: scope
    description: >-
      This work adapts FunSearch executable evolution to priority-function discovery
      for Feynman integral reduction.
  - from: alphaevolve
    to: code-generators
    type: adapts
    dimension: scope
    description: >-
      The code-generator study transfers the FunSearch/AlphaEvolve program-evolution
      pattern to web caching and congestion-control policies.
  - from: reevo
    to: or-agent
    type: extends
    dimension: search
    description: >-
      OR-Agent extends ReEvo's verbal gradients and reflection with a structured
      research tree, multi-agent search, and backtracking.
  - from: alphaevolve
    to: algo-dev
    type: adapts
    dimension: scope
    description: >-
      The tensor-network case study adapts OpenEvolve-style executable evolution to
      contraction-order design and compares several coding-agent systems.
  - from: ahd-survey
    to: geneplan
    type: contextualizes
    dimension: scope
    description: >-
      The AHD survey provides context for GenePlan's executable generalized-PDDL
      planner synthesis.
  - from: eoh
    to: participatory-rules
    type: adapts
    dimension: scope
    description: >-
      The participatory-budgeting framework adapts LLM-guided evolution to allocation
      rules while evaluating both utility and fairness.
  - from: alphaevolve
    to: pattern-gen
    type: adapts
    dimension: design-object
    description: >-
      OpenEvolve-style executable evolution is transferred from heuristics to
      programs that generate pattern collections for classical planning.
  - from: alphaevolve
    to: magellan
    type: adapts
    dimension: scope
    description: >-
      Magellan applies the AlphaEvolve coding-agent loop directly to LLVM and XLA
      compiler optimization heuristics.
  - from: meoh
    to: pareto-heuristics
    type: extends
    dimension: search
    description: >-
      The Pareto-grid method extends MEoH's multi-objective heuristic design with
      Pareto-front grids, runtime awareness, and structural diversity.
  - from: eoh
    to: exp-reflect
    type: extends
    dimension: feedback
    description: >-
      EvoPH extends EoH's fixed prompting by co-evolving prompts and heuristics from
      execution experience.
  - from: mcts-ahd
    to: memory-tree
    type: extends
    dimension: feedback
    description: >-
      MEMOIR extends tree-based AHD with branch-local and global memory for
      transferring useful discoveries across search branches.
  - from: or-survey
    to: macro-order
    type: contextualizes
    dimension: design-object
    description: >-
      The OR survey provides context for Order Matters' proxy-guided evolution of
      macro-placement ordering policies.
  - from: reevo
    to: revel
    type: extends
    dimension: feedback
    description: >-
      ReVEL extends reflective heuristic evolution with behavior-aware, group-wise,
      multi-turn performance feedback.
  - from: eoh
    to: llm-nas
    type: contextualizes
    dimension: design-object
    description: >-
      UH-NAS is a neighboring LLM-evolution route for hardware-aware neural
      architecture co-design, rather than a direct EoH extension.
  - from: orlm
    to: evooptigraph
    type: contrasts
    dimension: feedback
    description: >-
      EvoOptiGraph takes a weakness-driven graph co-evolution route, contrasting
      with ORLM's learned model-generation framework and fixed training distribution.
  - from: optibench
    to: frontieror
    type: generalizes
    dimension: scope
    description: >-
      FrontierOR generalizes optimization-modeling evaluation to large-scale,
      structurally complex algorithm-design tasks and test-time evolution.
  - from: reevo
    to: scoe
    type: generalizes
    dimension: design-object
    description: >-
      SCOE builds on ReEvo's reflective evolution while expanding the artifact from
      one heuristic to a cooperative operator ensemble.
  - from: eoh
    to: vrpagent
    type: adapts
    dimension: design-object
    description: >-
      VRPAgent adapts LLM-guided search to discover VRP-specific destroy and repair
      operators within a fixed routing solver backbone.
  - from: reevo
    to: dhfsp-evo
    type: extends
    dimension: search
    description: >-
      The multi-island dispatching-rule method extends ReEvo with personalized
      islands, semantic reflection, and offline/online evolution stages.
  - from: ahd-survey
    to: pace
    type: contextualizes
    dimension: design-object
    description: >-
      The AHD survey provides context for PACE's primitive-level representation and
      its attempt to preserve reusable code during executable program evolution.
  - from: eoh
    to: ahd-survey
    type: contextualizes
    dimension: historical
    description: >-
      This survey places EoH among the documented LLM-based algorithm-design methods.
  - from: eoh
    to: or-survey
    type: contextualizes
    dimension: historical
    description: >-
      This OR survey contextualizes EoH within a broader review of LLM-assisted
      optimization and algorithm design.
  - from: llm-optimization-survey
    to: eoh
    type: contextualizes
    dimension: historical
    description: >-
      This overview cites EoH while surveying the intersection of language models
      and optimization rather than proposing an EoH-derived method.
  - from: eoh
    to: cuda-feedback
    type: contextualizes
    dimension: feedback
