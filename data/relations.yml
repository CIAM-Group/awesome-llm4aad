# Directed relations always run from the earlier paper (`from`) to the later paper (`to`).
# `concurrent-work` is undirected and appears as a dashed line on the website.
# Every paper must participate in at least one relation. Add further links only
# when the papers' methods, experiments, or explicit comparisons support them.
relations:
  - from: alphaevolve
    to: qsa
    type: adapts
    dimension: scope
    description: >-
      QSA applies the AlphaEvolve-style program-evolution loop through OpenEvolve to quantum compiler
      passes and runtime policies. Its quantum-specific contribution is the verification, execution
      context and reward harness, not a direct modification of the AlphaEvolve implementation.
  # Search and memory methods.
  - from: mcts-ahd
    to: dream-cop
    type: contrasts
    dimension: search
    description: >-
      Both allocate heuristic-generation budget across revision branches. MCTS-AHD uses a prescribed
      UCT rule with exploration decay. Dream-COP instead searches executable branching and stopping
      policies by replaying recorded trees, then deploys the selected policy in the next real search
      round.
  - from: evomem
    to: ttme
    type: contrasts
    dimension: feedback
    description: >-
      Both turn evaluated code changes into reusable mutation guidance. EvoMem consolidates memory
      after a run for retrieval in later runs. TTME updates operational guidelines and strategy
      families during the active search, then adapts selected strategies into parent-specific edit
      instructions.
  - from: ahd-agent
    to: agenticevolve
    type: contrasts
    dimension: feedback
    description: >-
      Both let an agent gather evidence between formal heuristic evaluations. AHD Agent chooses from
      predefined instance-analysis and AST diagnostics. AgenticEvolve lets persistent island agents
      write and run their own analysis scripts before committing a candidate to the protected
      evaluator.
  - from: eoh
    to: prs
    type: contrasts
    dimension: search
    description: "EoH evolves paired ideas and code using evolutionary prompt operators; PRS separates directional idea perturbation from multiple code rewrites and controls expansion, compression, and steering within a bounded breadth-first frontier."
  - from: evomem
    to: expevolve
    type: contrasts
    dimension: feedback
    description: >-
      Both screen reusable ideas before using them to guide code changes. EvoMem promotes advice
      supported by mutation lineage and downstream outcomes. ExpEvolve admits explicit factors that
      explain previously unexplained score contrasts, then turns those factors into bandit-selected
      edit actions.
  - from: relayevolve
    to: specevo
    type: contrasts
    dimension: search
    description: "RelayEvolve hands a diversified cheap-model population to a stronger model once; SpecEvo continues cheap-model search while periodically choosing frontier synthesis, repair, or reframing from stagnation and consolidating trajectory evidence."
  - from: raise
    to: cvar-rmd
    type: contrasts
    dimension: feedback
    description: "RAISE generates nearby adversarial instances in an inner search, whereas CVaR-RMD keeps a specified heterogeneous condition distribution and changes candidate ranking to empirical adverse-quantile loss with tail-case mutation feedback."
  - from: discovery-forgetting
    to: epi
    type: contrasts
    dimension: feedback
    description: "Scaling Discovery Requires Forgetting restarts from the incumbent while discarding sessions and search history; Épi preserves versioned alternative branches and retrieves selected lessons and dead ends to continue research across sessions."
  - from: beyond-algorithm-evolution
    to: organon
    type: contrasts
    dimension: design-object
    description: >-
      Both let program search revise part of its own control process. Beyond Algorithm Evolution
      co-evolves operation-specific prompt templates with solver code. Organon instead exposes the
      live selection, survival, tool, memory and coordination procedures for reversible revision while
      keeping official evaluation fixed.
  - from: simpleevol
    to: discovery-forgetting
    type: contrasts
    dimension: feedback
    description: "SimpleEvol retains compressed search history to guide continued refinement; Scaling Discovery Requires Forgetting periodically removes both conversational and external candidate history, keeping only the incumbent before restarting the communicating team."
  - from: eoh-s
    to: epoch-coverage
    type: contrasts
    dimension: search
    description: >-
      Both search for complementary heuristic sets using instance-level performance. EoH-S uses
      complementarity in reproduction and survival with a frozen LLM. EPOCH also uses coverage to
      reward operators and trigger recovery, while training the generator on verified preference pairs
      and reflective improvements.
  - from: archagent-v2
    to: duodiscover
    type: contrasts
    dimension: feedback
    description: >-
      Both reduce the cost of evaluating generated optimization code. ArchAgent v2 searches using
      predetermined short ChampSim traces and validates selected prefetchers on longer traces.
      DuoDiscover co-discovers target-specific proxy evaluators and repeatedly checks their ranking
      agreement with true evaluations.
  - from: pathwise
    to: janus-world
    type: contrasts
    dimension: search
    description: >-
      The two systems give world models different roles in selecting search actions. PathWise
      generates and executes multiple heuristic rollouts before choosing an entailment step. JANUS
      predicts proposal value before implementation, combining expected improvement, information gain
      and future exploration utility.
  - from: shinkaevolve
    to: evoalloc
    type: extends
    dimension: search
    description: "EvoAlloc retains ShinkaEvolve's program-evolution pipeline but replaces full evaluation of every eligible proposal with an evolving allocation strategy, prospective disagreement checks, and random full evaluations of rejected candidates."
  - from: raise
    to: gal
    type: contrasts
    dimension: feedback
    description: >-
      Both alternate algorithm improvement with the discovery of failure cases. RAISE uses LLM-free
      instance search inside a prescribed uncertainty set. GAL evolves test-generating programs for
      inference algorithms, admits cases solved by unapproximated inference and repairs against the
      accumulated counterexamples.
  - from: sla
    to: discovery-forgetting
    type: contrasts
    dimension: feedback
    description: "SLA preserves the full external experiment record while rebuilding role-specific contexts; Discovery with Forgetting resets both conversations and historical records, retaining only the incumbent and its score."
  - from: guidance-ttt
    to: harnessttt
    type: contrasts
    dimension: design-object
    description: "Both train a proposer with frozen execution, but Guidance-TTT learns parent-conditioned strategic changes whereas HarnessTTT searches the executor's prompts, skills, tools, and middleware as a complete harness."
  - from: agentdiscover
    to: sla
    type: contrasts
    dimension: search
    description: "AgentDiscover lets agents query the history graph and choose experiments; SLA reconstructs restricted role-specific contexts in the harness and has a stateless Advisor assign concrete worker experiments."
  - from: refineevo
    to: dish
    type: contrasts
    dimension: feedback
    description: >-
      Both use failure evidence to guide solver revision. RefineEvo adapts operator prompts and
      retrieves successful and failed edit experiences. DiSH separately constrains the permitted edit
      scope by current feasibility and groups diagnostic failures into repair directions to reduce
      regressions.
  - from: adaeva
    to: evoalloc
    type: contrasts
    dimension: search
    description: "AdaEva allocates shared-instance evaluations using explicit halving or statistical-racing rules; EvoAlloc evolves natural-language allocation strategies and checks challenger decisions on future disagreements with audits of rejected candidates."
  - from: frugalevo
    to: specevo
    type: contrasts
    dimension: search
    description: "FrugalEvo uses a strong model for batches of strategies and a cheap model for repeated implementation; SpecEvo uses cheap speculative code search with a stronger navigator invoked periodically for synthesis and redirection."
  - from: eoh-s
    to: meco
    type: contrasts
    dimension: scope
    description: >-
      Both select complementary heuristic sets, but define coverage differently. EoH-S covers
      instances within one problem distribution. MECo combines task-conditioned populations and
      selects using source-task combinations before applying the frozen set to unseen constraint
      combinations.
  - from: evomem
    to: sedima
    type: contrasts
    dimension: feedback
    description: "EvoMem consolidates promising mutation events after a run with exemplars and provenance; SEDIMA writes evidence-linked insights after each evaluation and retrieves synthesized advice through a persistent semantic hierarchy across disjoint problems."
  # Applications and evaluation.
  - from: semantic-index-evo
    to: tgr-evodag
    type: contrasts
    dimension: feedback
    description: >-
      Both face coupled stages and costly retraining in generative retrieval systems. Evolving
      Semantic Indexes finds that a tiny-generator proxy transfers better for index changes than for
      unrestricted objective or pipeline edits. TGR-EvoDAG instead budgets stage-dependent retraining
      and explicitly adapts downstream stages after upstream changes.
  - from: evoskillrec
    to: tgr-evodag
    type: contrasts
    dimension: design-object
    description: >-
      Both reuse code discoveries in recommender search. EvoSkillRec promotes validated modules into
      typed skills for composition inside an architecture. TGR-EvoDAG keeps a graph of evaluated code
      versions and merges complementary branches, resolving code and cross-stage dependencies.
  - from: shinkaevolve
    to: adapt-science
    type: adapts
    dimension: search
    description: >-
      ADAPT uses ShinkaEvolve as one of its explicit evolution backends, wrapping
      program search in scientific-history retrieval and separate evolution of
      initialization-selection policies and numerical optimizers.
  - from: alphaevolve
    to: precocial
    type: contrasts
    dimension: feedback
    description: >-
      For pretraining-program search, PRECOCIAL contrasts its single accepted lineage with
      population-based AlphaEvolve runs that train a fresh network for each candidate. Continuing or
      rolling back the accepted checkpoint reduces repeated training but makes candidate fitness
      depend on search history.
  - from: tide
    to: evo-bnb
    type: adapts
    dimension: search
    description: >-
      Evo-B&B adapts TIDE's multi-island organization and separation of structural search from
      numerical tuning to joint SCIP branching and node-selection policies. It uses matched decision
      probes for diversity and limits bounded-Gaussian tuning to retained policies close to the island
      best.
  - from: aite
    to: siteevo
    type: contrasts
    dimension: search
    description: >-
      AITE retains a wireless performance-complexity frontier, whereas SiteEvo first
      selects a site-specific BER anchor and then searches its structural descendants
      for lower block-level cost under an explicit BER-preservation constraint.
  - from: mcts-ahd
    to: llm-blockfe
    type: contrasts
    dimension: search
    description: >-
      MCTS-AHD selects heuristic-program branches with UCT and backpropagated quality statistics.
      LLM-BlockFE instead freezes accepted code blocks and uses depth-calibrated estimates of child
      success to continue or backtrack, preserving stable prefixes while restricting subsequent edits.
  - from: leanplan
    to: kernaut
    type: contrasts
    dimension: feedback
    description: >-
      LeanPlan accepts a domain heuristic only with Lean-checked consistency and goal-awareness proofs
      under an explicit certificate. Kernaut instead assembles kernels through PSD-preserving
      construction contracts, supplemented by checks on component purity and interfaces. The
      comparison is proof generation versus constrained construction, not an equivalence of
      guarantees.
  - from: reevo
    to: reevo-fas
    type: adapts
    dimension: design-object
    description: >-
      ReEvo-FAS directly applies reflective code evolution to crossover, mutation,
      and local-search operators for antenna-port selection, evaluating them through
      secrecy-aware beamforming and freezing the code before deployment.
  - from: muevo
    to: rldiscover
    type: contrasts
    dimension: search
    description: >-
      MuEvo keeps component eligibility reversible and evaluates updates with multiple collaborators
      throughout search. RLDiscover first freezes low-gain single-component search arms, validates a
      merged seed, then allows joint changes to any components under staged training evaluation. These
      are different schedules for discovering component interactions.
  - from: a-ceoh
    to: leanplan
    type: contrasts
    dimension: feedback
    description: >-
      A-CEoH exposes host-A* code and selects generated heuristics by time-limited
      solution quality, whereas LeanPlan requires domain certificates and proofs of
      consistency and goal awareness before comparing planning performance.
  - from: autosella
    to: adapt-science
    type: contrasts
    dimension: design-object
    description: >-
      The studies expose different parts of a scientific optimization pipeline to code search.
      AutoSella edits the molecular optimizer while benchmark starting structures remain fixed. ADAPT
      evolves both the policy that selects an initialization from historical designs and the optimizer
      that follows it. This compares the boundary of the design space, not performance across the two
      scientific tasks.
  - from: eoh
    to: trace
    type: extends
    dimension: feedback
    description: >-
      TRACE retains an EoH-style heuristic population and generation loop, adding
      agents that execute schema-specific log analysis and expose distilled system
      insights and callable surrogate tools to later proposals.
  - from: shinkaevolve
    to: autonomous-tsad
    type: contrasts
    dimension: search
    description: >-
      The anomaly-detector study contrasts ShinkaEvolve's sampled parent and inspiration programs with
      a single coding session that retains its sequence of attempts, including regressions. The latter
      returns the session-best detector without automatically reverting each unsuccessful edit.
  - from: network-world-models
    to: trace
    type: contrasts
    dimension: feedback
    description: >-
      Network World Models provides queryable counterfactual rollouts and marginal
      action credit, while TRACE extracts diagnostic knowledge and tools from
      observed execution logs, contrasting intervention-based and retrospective feedback.
  - from: eoh
    to: openarchevo
    type: adapts
    dimension: design-object
    description: >-
      OpenArchEvo explicitly adopts EoH's idea-code pairing for spiking-network architecture programs
      and jointly revises code and design rationales. It adds initialization-time fingerprints and
      surrogate-guided training allocation rather than reusing EoH's full search procedure.
  - from: gradaslim
    to: autonovo
    type: contrasts
    dimension: design-object
    description: >-
      Both studies use ERA to search executable DNA designers. GrAdaSlim enforces deletion-only,
      order-preserving outputs and scores activity with a design oracle. AutoNovo searches
      length-preserving designers and can score programs with an additional oracle hidden from the
      designer, separating edit validity from cross-oracle transfer.
  - from: mcts-ahd
    to: automip
    type: contrasts
    dimension: search
    description: >-
      MCTS-AHD allocates expansions among heuristic-program nodes using UCT. AutoMIP keeps unused
      research directions in a separate pool and restores compatible code and artifacts before a
      direction switch. The contrast is program-tree selection versus explicit management of research
      directions and experimental state.
  - from: formuevo
    to: automip
    type: contrasts
    dimension: design-object
    description: >-
      FormuEvo restricts improvement to formulations consumed by a fixed solver;
      AutoMIP's task skill permits broader executable research directions, including
      decomposition and neighborhood search, and restores the artifacts each requires.
  - from: alphaevolve
    to: automark
    type: contextualizes
    dimension: feedback
    description: >-
      AutoMark cites AlphaEvolve when motivating evaluator-guided discovery, then studies the
      additional statistical safeguards needed for watermark search. Distribution preservation and
      false-positive controls are checked before detection and robustness scores are trusted. This is
      evaluation context, not implementation reuse.
  - from: evoskillrec
    to: memevo-video
    type: contrasts
    dimension: design-object
    description: >-
      Both methods expand a typed library with generated executable modules. EvoSkillRec promotes
      modules carried by successful recommender architectures for later recombination. MemEvo admits
      new memory operators inside fixed causal roles and searches those roles in a prescribed order,
      trading compositional freedom for a stable runtime contract.


  # R01
  - from: frontieror
    to: decompgym
    type: contrasts
    dimension: feedback
    description: "FrontierOR lets agents choose a full solver route, whereas DecompGym fixes a decomposition contract and audits operative master–subproblem flow in addition to output quality."
  # R02
  - from: ai4ai-bench
    to: research-arena
    type: contrasts
    dimension: feedback
    description: >-
      AI4AI-Bench separates proxy-guided development from a fresh final run scored by a hidden
      evaluator. Auto-Research Arena exposes constrained resource objectives in a shared
      language-modeling setting and charges every started GPU experiment, including failures. They
      assess research code under different feedback and budget contracts.
  # R03
  # R04
  - from: alphaevolve
    to: radonbench
    type: adapts
    dimension: design-object
    description: "RadonBench uses an OpenEvolve constructor-program search with exact Radon certificates, transferring executable evolutionary discovery to unresolved geometric construction targets without reporting a successful target construction."
  # R05
  # R06
  - from: evolution-or-illusion
    to: token-accounting
    type: contrasts
    dimension: feedback
    description: >-
      Evolution or Illusion compares width and depth at a fixed number of proposals. The
      token-accounting study treats proposal cost as variable and compares logged search with
      independent sampling at equal cumulative model tokens. The papers address complementary
      accounting choices, and the latter describes the former as concurrent work.
  # R07
  - from: behavesim
    to: divalgo
    type: contrasts
    dimension: feedback
    description: >-
      BehaveSim compares instrumented problem-solving trajectories with dynamic time warping. DivAlgo
      estimates population diversity using a source-code embedding distilled from pairwise LLM
      judgments and a Vendi score, with separate ontology labels for interpretation. It also checks
      the static metric on BehaveSim's human-curated examples.
  # R08
  - from: alphaevolve
    to: bermudan-audit
    type: contextualizes
    dimension: feedback
    description: >-
      The Bermudan audit cites AlphaEvolve's mathematical-discovery setting to motivate a different
      evaluation regime. For stopping policies scored by noisy simulation, it separates policy value,
      estimated primal-dual gaps and bound looseness, showing why a search score alone need not
      certify improvement.
  # R09
  # R10
  - from: strongprior
    to: d2k-bench
    type: contrasts
    dimension: feedback
    description: >-
      StrongPrior guides search with executable benchmark algorithms as starting points and recurring
      code examples. D2K-Bench supplies layered expert design guidance while withholding expert
      implementations. The contrast concerns the form of prior knowledge available to code generation,
      not a controlled comparison of code and prose across tasks.
  # R11
  # R12
  # R13
  - from: alphaevolve
    to: eaqecc-families
    type: adapts
    dimension: scope
    description: "The EAQECC study uses AlphaEvolve to modify exact-oracle-guided search programs, then separates finite-code generation from researcher-led family generalization, checked algebra, and nonexistence certificates."
  # R14
  - from: ascendevolve
    to: rngd-kernel-loop
    type: contrasts
    dimension: feedback
    description: >-
      For unfamiliar accelerators, AscendEvolve retrieves from a version-scoped platform corpus and
      records task-local counterevidence. The RNGD loop explicitly builds and rechecks its platform
      knowledge with probe kernels and compiler tests when the toolchain changes.
  # R15
  # R16
  # R17
  - from: d2k-bench
    to: justgoal
    type: contrasts
    dimension: feedback
    description: >-
      D2K-Bench isolates the value of supplied algorithmic and dataflow guidance with paired
      kernel-development runs. JustGoal asks a general coding agent to construct its own optimization
      loop from a goal and constraints. They probe the need for specialized guidance under different
      tasks and controls.
  # R18
  - from: alphaevolve
    to: splatlab
    type: adapts
    dimension: design-object
    description: "SplatLab wraps AlphaEvolve-style editable program blocks in verified 3DGS plugin scaffolds and a domain taxonomy, linking evolved implementations to measured experiments and run-backed manuscript claims."
  # R19
  - from: reevo
    to: splatlab
    type: adapts
    dimension: feedback
    description: >-
      SplatLab explicitly adopts ReEvo's verbal-gradient idea, but sends rationales from measured 3DGS
      candidate comparisons to its ideator. The reflections guide new plugin ideas rather than ReEvo's
      original heuristic mutation step.
  # R20
  - from: llm-sr
    to: optscientist
    type: contrasts
    dimension: design-object
    description: >-
      LLM-SR proposes symbolic equations that predict observed outputs. OptScientist instead recovers
      objectives and constraints whose optimizing choices explain those outputs, using an optimization
      learner and symbolic distillation inside an LLM-assisted research loop.
  # R21
  # R22
  - from: tilecas
    to: edgekernelbench
    type: contrasts
    dimension: design-object
    description: >-
      Both retain kernel candidates across abstraction levels. TileCas explicitly selects the source
      candidate, edit action and target level for a base workflow. LEKA assigns agents to portable IR
      levels and routes hardware feedback to the responsible layer. Both support revisiting retained
      alternatives.
  # R23
  - from: d2k-bench
    to: kernel-proof
    type: contrasts
    dimension: feedback
    description: >-
      D2K-Bench checks generated kernels by execution and separately judges adherence to expert
      designs. Kernel Proofs checks semantic equivalence and parallel safety through formal
      obligations under stated assumptions. The comparison concerns what correctness evidence
      establishes, not which method produces faster kernels.
  # R24
  # R25
  - from: dgm
    to: harmony-harness
    type: contrasts
    dimension: design-object
    description: "DGM archives whole self-modified coding agents; Harmony Harness separates general and environment-specific components and decomposes selection across objectives before recomposing the harness."
  # R26
  # R27
  - from: funsearch
    to: elitetable
    type: contrasts
    dimension: search
    description: >-
      FunSearch samples parents within separate islands and periodically reseeds weak islands.
      EliteTable uses one top-ten table, frozen during each generation, with uniform parent sampling
      for edit and remix proposals. These are different archive choices, not a demonstrated ranking
      between them.
  # R28
  - from: alphaevolve
    to: art-eda
    type: contextualizes
    dimension: scope
    description: "The EDA trials explicitly situate their executable research beside AlphaEvolve, then distinguish independent acceptance authority and whole-tool utility from intermediate algorithmic or proof milestones."
  # R29
  # R30
  - from: weight-five-bb
    to: eaqecc-families
    type: contrasts
    dimension: feedback
    description: >-
      For quantum-code discovery, Weight-Five BB uses staged distance estimates to rank candidates and
      certifies selected results afterward. EAQECC Discovery uses exact parameter evaluation within
      its program search and independently rechecks returned codes. The code families and evaluation
      costs differ.
  # R31
  - from: alphaevolve
    to: triza
    type: contrasts
    dimension: search
    description: >-
      AlphaEvolve proposes code diffs within user-defined editable regions. TRIZa requires a declared
      technical contradiction and a typed TRIZ transformation before evaluation. The difference is how
      proposals are constrained, not whether an evaluator checks the result.
  - from: shinkaevolve
    to: discovery-init
    type: extends
    dimension: search
    description: >-
      The initialization study wraps ShinkaEvolve with budgeted parallel seed
      generation, then retains its sequential search machinery. It tests whether
      a stronger starting program helps more than spending the same budget on refinement.
  - from: discovery-init
    to: holidivevolve
    type: contrasts
    dimension: search
    description: >-
      Discovery Init prioritizes high-quality seeds with light duplicate filtering.
      HoliDivEvolve selects separated island seeds and continues diversity management
      through migration, exposing different quality-diversity choices at initialization.
  - from: refineevo
    to: labbook
    type: contrasts
    dimension: feedback
    description: >-
      RefineEvo retrieves structured positive and negative lessons to guide its planned evolutionary
      operations. LabBook lets one agent rewrite a compact notebook and selectively reopen exact past
      code and results before proposing the next program.
  - from: labbook
    to: muse
    type: contrasts
    dimension: feedback
    description: >-
      LabBook updates memory from the current discovery run and retrieves exact experiments before
      each new program. MUSE freezes a bank built from prior tasks, then gates implementation advice
      after tool returns. They place experimental memory at different points in the coding process.
  - from: evopinn
    to: conflictguide
    type: contrasts
    dimension: feedback
    description: >-
      EvoPINN diagnoses neural-PDE training trajectories to guide representation
      and training edits. ConflictGuide explicitly distinguishes those diagnostics
      from qualified probes of competing behaviors used for guidance and guarded retention.
  - from: goalevolve
    to: conflictguide
    type: contrasts
    dimension: feedback
    description: >-
      GoalEvolve diagnoses physical-design stages from target gaps and tracks each edit's local gain,
      side effects and final outcome. ConflictGuide keeps a mechanism-specific pair of competing
      behaviors as its diagnostic target and qualifies probes before using them in model-code
      evolution.
  - from: component-feedback
    to: conflictguide
    type: contrasts
    dimension: feedback
    description: >-
      Component Feedback associates changed functions and constants with existing
      metric deltas. ConflictGuide designs and qualifies behavior-specific probes;
      one improves the record of edits, while the other changes what is measured.
  - from: calm
    to: search-to-signal
    type: extends
    dimension: feedback
    description: >-
      Search to Signal retains CALM's search transitions and GRPO backend while
      implementing alternative reward mappings. Shared-record and reset-search audits
      separate effective learner credit from archive growth and endpoint performance.
  - from: calm
    to: pcpo
    type: contrasts
    dimension: search
    description: >-
      CALM updates its generator from each newly evaluated evolutionary group. PCPO alternates fresh
      on-policy updates with replay of structurally curated elites stored in instance-specific
      buckets. These are different ways to reuse executable feedback for generator training, not an
      established inheritance link.
  - from: pcpo
    to: search-to-signal
    type: contrasts
    dimension: feedback
    description: >-
      PCPO gives every replayed verified elite positive rank-based credit. Search to Signal keeps
      CALM's group-relative normalizer fixed and examines when positive learner credit does not mean
      improvement over a parent or frontier. This contrasts credit rules, not end-to-end system
      performance.
  - from: reevo
    to: component-feedback
    type: contrasts
    dimension: feedback
    description: >-
      ReEvo uses LLM-written reflection on candidate differences. Component Feedback
      instead extracts changed functions and constants mechanically and pairs each
      edit set with measured metric deltas, without claiming component-wise causal credit.
  - from: e2oc
    to: hemo
    type: contrasts
    dimension: design-object
    description: >-
      E2OC co-evolves operator design thoughts and implementations through prescribed MCTS and
      rotation rules. HEMO also makes the design harness's retrieval, targeting, parent-selection and
      generation roles editable, while keeping evaluation and archive interfaces fixed.
  - from: shinkaevolve
    to: holidivevolve
    type: contrasts
    dimension: search
    description: >-
      ShinkaEvolve rejects code-near-duplicate proposals before expensive evaluation.
      HoliDivEvolve uses code distance to choose island seeds and complementary
      migrant references, intervening in search diversity at different stages.
  - from: evomem
    to: muse
    type: contrasts
    dimension: feedback
    description: >-
      EvoMem curates provenance-backed lessons from past program-evolution jobs and retrieves advice
      before mutations. MUSE extracts lessons from successful and failed coding trajectories, then
      selectively injects implementation checks after tool returns.
  - from: ael
    to: funsearch
    type: concurrent-work
    dimension: historical
    description: >-
      AEL and FunSearch independently established LLM-guided evolutionary search
      for algorithm or program design in late 2023.
  - from: ael
    to: eoh
    type: extends
    dimension: design-object
    description: >-
      EoH extends algorithm evolution with a joint representation of
      natural-language ideas and executable heuristic code.
  - from: eoh
    to: eoh-s
    type: generalizes
    dimension: scope
    description: >-
      EoH-S changes the output from one heuristic to a complementary set that
      covers varied instance distributions.
  - from: eoh-s
    to: muevo
    type: extends
    dimension: design-object
    description: >-
      MuEvo keeps the ensemble-level design object introduced by EoH-S but adds
      reversible component management and explicit co-evolution for interacting
      heuristic components.
  - from: reevo
    to: muevo
    type: extends
    dimension: search
    description: >-
      MuEvo retains ReEvo's reflective LLM-guided crossover and mutation loop,
      then extends it with dynamic component management and ensemble-aware
      co-evolution for multi-heuristic frameworks.
  - from: eoh
    to: ast-evo
    type: extends
    dimension: search
    description: >-
      The AST study replaces EoH's semantic crossover and mutation with structural
      AST disruption followed by LLM repair; it then evaluates this operator in EoH,
