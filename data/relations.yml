    to: seaevo
    type: extends
    dimension: search
    description: >-
      SeaEvo extends EoH-style evolutionary heuristic search with a persistent
      strategy-space archive and diversity-aware navigation.
  - from: a2dept
    to: atlas
    type: concurrent-work
    dimension: design-object
    description: >-
      A2DEPT and ATLAS independently move LLM-based AHD beyond component
      synthesis toward open-ended solver synthesis and scaffold-free
      full-algorithm synthesis, developed concurrently.
  - from: mcts-ahd
    to: clade-ahd
    type: extends
    dimension: search
    description: >-
      Clade-AHD retains MCTS-AHD's heuristic tree and LLM-based expansion while
      replacing node-level UCT estimates with clade-level Bayesian beliefs and
      Thompson sampling.
  - from: reevo
    to: simpleevol
    type: contrasts
    dimension: search
    description: SimpleEvol retains execution feedback and accumulated guidance but uses a single agent trajectory
      instead of ReEvo’s explicitly managed evolutionary and reflective operators; the comparison concerns how
      much search structure remains hand-designed.
  - from: janus
    to: bife
    type: contrasts
    dimension: feedback
    description: Both reduce expensive program evaluations, but Janus evolves proxy evaluator programs from actual
      outcomes whereas BiFE screens branching rules with a fixed strong-branching imitation objective before
      full solver evaluation.
  - from: atlas
    to: heurevo
    type: contrasts
    dimension: design-object
    description: HeurEvo explicitly separates plans, executable implementations, and a reusable component library.
      ATLAS organizes complete algorithms in an embedding-guided archive; HeurEvo instead makes the high-level
      plan an independently revisable search state.
  - from: dgm
    to: hada
    type: contrasts
    dimension: design-object
    description: HADA discusses empirically validated self-improvement in the DGM line, but separates an editable
      hyper-agent from a task agent that modifies a MetaBBO project. The distinction is which design machinery
      can change, not a claim that HADA reuses DGM code.
  - from: reevo
    to: quantforge
    type: contrasts
    dimension: feedback
    description: ReEvo supplies reflective verbal guidance from search outcomes. QuantForge makes explanatory
      claims into preregistered controls and requires verdicts to cause checked code responses, distinguishing
      plausible advice from experimentally tested mechanisms.
  - from: alphaevolve
    to: modular-game-search
    type: adapts
    dimension: scope
    description: The game-search study explicitly builds on AlphaEvolve and separates reusable search mechanisms
      from game-specific knowledge, using distinct credit and evaluation rules to evolve algorithms across
      games.
  - from: llamea-bo
    to: ondesign
    type: contrasts
    dimension: scope
    description: LLaMEA-BO designs reusable Bayesian optimization algorithms offline. OnDesign synthesizes and
      selects algorithms while optimizing the target task, with feedback credited to both algorithm candidates
      and state-analysis guidelines.
  - from: archagent-v2
    to: presage
    type: contrasts
    dimension: design-object
    description: ArchAgent v2 evolves hardware prefetchers within the cache hierarchy, while Presage inserts
      software prefetches into application code and evaluates executable patches. Their editable layers and
      implementation constraints are different.
  - from: mcts-ahd
    to: algoevo
    type: contrasts
    dimension: feedback
    description: MCTS-AHD uses a search tree over heuristic candidates. AlgoEvo organizes measured experience
      cards in a derivation tree and retrieves them with situation-conditioned UCB, separating experience
      reuse from direct heuristic-lineage selection.
  - from: reevo
    to: routerepair
    type: contrasts
    dimension: feedback
    description: RouteRepair replaces undifferentiated improvement advice with a frozen diagnosis of
      parent-specific failure cases and explicit non-failure protection. A proposed repair must pass measured
      recovery and collateral-damage checks before normal population admission.
  - from: reforge
    to: routerepair
    type: contrasts
    dimension: feedback
    description: Both constrain regressions during targeted revision. ReForge protects historical traffic-family
      scores, whereas RouteRepair protects parent-defined non-failure instances using one-sided collateral
      loss; improvement and protection are measured at different granularities.
  - from: reevo
    to: quantumevo
    type: adapts
    dimension: scope
    description: QuantumEvo explicitly uses ReEvo to evolve CUDD variable-reordering functions, evaluating
      candidates through downstream reversible-circuit quantum cost rather than only the size of the decision
      diagram.
  - from: eoh
    to: llm-hcjg
    type: generalizes
    dimension: design-object
    description: LLM-HCJG broadens thought/code heuristic evolution to a shared blueprint and jointly generated
      initialization/penalty functions. Full-pair evaluation and component-swapping tests address
      compatibility between interacting routing components.
  - from: llm-hcjg
    to: rideskill
    type: contrasts
    dimension: search
    description: Both design interacting routing components, but LLM-HCJG evolves an initialization/penalty pair
      together, whereas RideSkill trains a skill library, freezes it, then evolves a combiner and finally a
      repositioner. Joint and staged credit assignment are distinct choices.
  - from: eoh
    to: es-ahd
    type: contrasts
    dimension: search
    description: ES-AHD uses elite core insights and correlated temperature perturbations to control subsequent
      heuristic generation, contrasting with EoH’s predefined exploration and modification operators. Its
      evolution-strategy analogy is not an explicit covariance-matrix adaptation.
  - from: eoh
    to: macroagent
    type: adapts
    dimension: scope
    description: MacroAgent explicitly adopts EoH-style thought/code evolution and prompt operators for the
      contour-generation component of macro legalization, while clustering, assignment, and the surrounding
      placement pipeline remain fixed.
  - from: llamea-hpo
    to: bi-ezp
    type: contrasts
    dimension: search
    description: Both separate generated structure from numerical tuning. LLaMEA-HPO configures generated
      optimizers, while Bi-EZP nests CMA-ES inside a search over zero-cost-proxy aggregation code and ranks
      structures by held-out Kendall correlation.
  - from: alphaevolve
    to: seisevo
    type: contextualizes
    dimension: scope
    description: "SeisEvo explicitly situates seismic reconstruction in evaluator-guided executable program
      discovery, including AlphaEvolve. It emphasizes a domain-specific boundary: editable classical
      mechanisms and physical admissibility checks must prevent meaningless score improvements; no backbone
      reuse is asserted."
  - from: goalevolve
    to: macroagent
    type: contrasts
    dimension: feedback
    description: GoalEvolve traces frozen end-to-end physical-design goal shortfalls back to source mechanisms.
      MacroAgent instead evolves a bounded contour component using legalization-specific
      regularity/displacement feedback, illustrating different feedback granularity within physical-design
      algorithm discovery.
  - from: featurehospital
    to: bi-ezp
    type: contrasts
    dimension: design-object
    description: Both assemble task-specific criteria from predefined primitives. FeatureHospital diagnoses data
      and assigns catalog losses and weights; Bi-EZP generates aggregation programs over four proxy signals
      and separately optimizes their numeric parameters.
  - from: evomem
    to: eps-memevo
    type: contrasts
    dimension: feedback
    description: EvoMem emphasizes provenance-backed extraction and retrieval of successful mutation knowledge.
      ε-MemEvo instead learns whether to skip retrieved advice, provide a hint, or inject stronger guidance,
      addressing when memory should affect search.
  - from: reevo
    to: evomem
    type: contrasts
    dimension: feedback
    description: ReEvo accumulates reflective guidance within an evolutionary run. EvoMem persists parent–child
      mutation evidence across runs and tasks and retrieves bounded, provenance-linked advice while leaving
      the host evaluator and selection rules unchanged.
  - from: elmer
    to: es-ahd
    type: contrasts
    dimension: search
    description: ELMER trains requested mutation strength against measured behavioral displacement. ES-AHD
      controls sampling through temperature and elite guidance; sampling variability and calibrated behavioral
      step size are different mechanisms.
  - from: alphaevolve
    to: archagent-v2
    type: adapts
    dimension: scope
    description: ArchAgent v2 uses AlphaEvolve to search hardware prefetcher implementations, adding staged and
      joint cache-level evolution, storage-budget auditing, and short-trace search followed by longer-trace
      validation.
  - from: reevo
    to: trace-guided-design
    type: contrasts
    dimension: feedback
    description: The simulation-trace study grounds revision hypotheses in queryable scheduling events and
      operational states, rather than relying on aggregate better/worse scores alone. A fixed policy executes
      within each run, and repeated simulation decides promotion.
  - from: alphaevolve
    to: janus
    type: extends
    dimension: feedback
    description: Janus explicitly builds on AlphaEvolve-style island search and adds evolving proxy-evaluator
      programs, region-conditioned credit, and provisional candidate queues. Only real-valid outcomes enter
      the target population or update the incumbent.
  - from: mosaic
    to: piac
    type: contrasts
    dimension: feedback
    description: MOSAIC generates instances that expose relative strengths of specialist pairs. PIAC values
      instances by gains accessible through perturbations of the current portfolio, distinguishing
      discriminative difficulty from estimated improvement potential.
  - from: shinkaevolve
    to: relayevolve
    type: extends
    dimension: search
    description: RelayEvolve uses a common ShinkaEvolve backend and adds a Grow–Deepen scheduler, quality-diverse
      seed-bank curation, and adaptive cheap-to-strong population handoff under measured inference budgets.
  - from: evopinn
    to: adsl-pde
    type: contrasts
    dimension: design-object
    description: EvoPINN edits executable representation/training modules and verifies generated changes. ADSL-PDE
      searches typed solver descriptions compiled deterministically into implementations, moving many validity
      constraints into the representation itself.
  - from: eoh-s
    to: dyca
    type: extends
    dimension: search
    description: DyCA explicitly extends EoH-S complementary population management with inverse-cluster-size
      weights, dynamic response-based instance clustering, and coordinated specialist pools to reduce
      majority-instance bias.
  - from: mosaic
    to: dyca
    type: contrasts
    dimension: search
    description: MOSAIC organizes specialists and generated instances in a grid of structural features. DyCA
      instead periodically clusters instance responses to anchor algorithms and balances complementary and
      specialist pools, changing how specialization regions are defined.
  - from: reevo
    to: mosaic
    type: contrasts
    dimension: feedback
    description: MOSAIC contrasts scalar better/worse reflection with two region-specific specialization insights
      and a hybridization insight grounded in discriminative instances. These insights persist in archive
      cells even when their specialist changes.
  - from: funsearch
    to: funl2o
    type: adapts
    dimension: design-object
    description: FunL2O explicitly uses a FunSearch-style program-evolution loop for feature functions. Each
      candidate must satisfy a semantic contract and retrain a fixed learning-to-optimize pipeline before
      downstream performance determines fitness.
  - from: costada
    to: relayevolve
    type: contrasts
    dimension: search
    description: CostAda prices local/global frontier progress and tactic interventions throughout search.
      RelayEvolve allocates short cheap-model trajectory blocks and then hands a curated population to a
      stronger model, controlling cost at a different level.
  - from: llamea-hpo
    to: llamea-mobo
    type: adapts
    dimension: scope
    description: LLaMEA-MOBO explicitly follows LLaMEA-HPO’s separation of generated code and hyperparameter
      optimization, adapting it to complete multi-objective Bayesian optimizers evaluated by normalized
      hypervolume.
  - from: qdevo
    to: aite
    type: contrasts
    dimension: search
    description: QDEvo preserves quality/runtime alternatives through semantic niches and local Pareto survival.
      AITE organizes multiple executable implementations per explicit idea and maintains a global
      performance–complexity frontier, giving different meanings to diversity.
  - from: reevo
    to: qdevo
    type: contrasts
    dimension: feedback
    description: QDEvo explicitly develops reflective guidance into immediate comparisons, multi-generation
      summaries, and error-focused repair memory. Unlike ReEvo’s single-quality search setting, these signals
      support quality/runtime trade-offs and semantic-niche survival.
  - from: qdevo
    to: mosaic
    type: contrasts
    dimension: search
    description: QDEvo defines niches through canonicalized code embeddings and Pareto competition. MOSAIC defines
      niches through instance structure and local specialist performance, contrasting program-space diversity
      with coverage of problem regimes.
  - from: relayevolve
    to: evolution-or-illusion
    type: contrasts
    dimension: search
    description: RelayEvolve controls trajectory growth and depth online before population handoff. Evolution or
      Illusion instead reconstructs an offline seeds-by-iterations frontier from logged runs; the latter
      diagnoses allocation sensitivity but does not provide an online controller.
  - from: when-ai-designs-ai
    to: ai4ai-bench
    type: contrasts
    dimension: feedback
    description: When AI Designs AI maps code to human-derived module coordinates to measure structural
      difference. AI4AI-Bench categorizes training-repository changes by the layer they modify and
      independently reruns submitted code; both distinguish measured quality from the nature of the design
      change.
  - from: when-ai-designs-ai
    to: tcsalgbench
    type: contrasts
    dimension: feedback
    description: When AI Designs AI assesses empirical performance and module-level design differences.
      TCSAlgBench asks whether computational guarantees can be justified by natural-language proofs, adding a
      separate evaluation axis whose verifier acceptance is not formal correctness.
  - from: adsl-pde
    to: evoskillrec
    type: contrasts
    dimension: design-object
    description: Both expose typed executable components to constrain composition. ADSL-PDE compiles solver
      descriptions; EvoSkillRec represents recommendation architectures as skill genomes and promotes
      validated code inventions into a reusable second-tier library.
  - from: janus
    to: jet
    type: contrasts
    dimension: feedback
    description: Janus evolves proxies online and requires real target evaluation before promotion. JET freezes a
      judge learned on source trajectories and adapts agent programs without target reward access, making
      evaluator trust and validation fundamentally different.
  - from: piac
    to: kernelzero
    type: contrasts
    dimension: feedback
    description: Both generate tasks in response to current algorithm capability. PIAC uses perturbation-based
      potential gain to evolve a heuristic portfolio; KernelZero rewards Torch modules near a half-correct
      coder frontier and alternately trains proposer and coder weights.
  - from: formuevo
    to: optiskill
    type: contrasts
    dimension: feedback
    description: FormuEvo stores condition–strategy–effect evidence for solver-efficient formulation evolution.
      OptiSkill separates general modeling procedures from local corrective experiences and validates skill
      additions/repairs at batch boundaries before reuse.
  - from: evomem
    to: ees
    type: contrasts
    dimension: feedback
    description: EvoMem persists provenance-linked mutation advice, while EES specifies task-indexed lessons about
      executable procedures, failures, and ensembles. EES’s development ledger does not isolate a measured
      causal benefit of the proposed memory mechanism.
  - from: constraint-reformulation
    to: formuevo
    type: contrasts
    dimension: feedback
    description: Both evolve solver-facing model programs. Constraint Model Reformulation selects diverse runtime
      profiles and checks returned satisfaction answers; FormuEvo diagnoses presolve/relaxation/search-tree
      behavior and checks optimization objectives on development instances.
  - from: graphir
    to: adsl-pde
    type: contrasts
    dimension: design-object
    description: GraphIR extracts descriptive architecture state from code to guide later edits, with tracing and
      static fallbacks. ADSL-PDE makes typed descriptions the source of deterministic compilation; descriptive
      context and prescriptive representation provide different validity boundaries.
  - from: aite
    to: wara
    type: contrasts
    dimension: scope
    description: AITE searches implementations of wireless algorithm ideas against a supplied evaluator. WARA
      extends the workflow boundary from problem formulation through algorithm design to evidence and
      manuscript artifacts, while its reported comparative scoring is primarily manuscript-level.
  - from: eoh
    to: lago
    type: generalizes
    dimension: design-object
    description: >-
      LaGO generalizes EoH-style heuristic evolution into a modular program
      optimization framework that can update multiple executable heuristic roles.
  - from: eoh
    to: specahd
    type: generalizes
    dimension: scope
    description: >-
      SpecAHD broadens automated heuristic design from whole-instance scoring to
      within-instance specialization across heterogeneous repair regions.
  - from: eoh
    to: autosnd
    type: extends
    dimension: feedback
    description: >-
      AutoSND extends evolutionary heuristic discovery by compiling execution
      quality, runtime, and failure evidence into structural policies for search.
  - from: mcts-ahd
    to: autosnd
    type: extends
    dimension: feedback
    description: >-
      AutoSND extends tree-search-based heuristic discovery with execution-evidence
      archives and explicit reuse, avoidance, and boundary policies.
  - from: a2dept
    to: dga2d
    type: contrasts
    dimension: design-object
    description: >-
      DGA2D and A2DEPT both pursue system-level algorithm design, but DGA2D uses
      directed operator graphs and path-dependent credit while A2DEPT uses program trees.

  # Method reuse and specific design comparisons
  - from: eoh
    to: meco
    type: generalizes
    dimension: scope
    description: >-
      MECo's EoH-MECo variant retains EoH's native generation and population updates inside each task
      population. MECo adds task pairing, parent transfer and source-only set selection for zero-shot
      evaluation on unseen constraint combinations.
  - from: reevo
    to: meco
    type: generalizes
    dimension: scope
    description: >-
      The ReEvo-MECo variant runs ReEvo's original search rules within MECo's task populations.
      Task-level pairing and heuristic transfer broaden the local engine to source-only multi-task
      search and zero-shot heuristic-set deployment.
  - from: hsevo
    to: meco
    type: generalizes
    dimension: scope
    description: >-
      The HSEvo-MECo variant uses HSEvo as the local heuristic engine while MECo manages task
      populations, transfers and final set selection. This broadens the engine to unseen constraint
      combinations, with initialization compatibility rules documented in the appendix.
  - from: shinkaevolve
    to: sedima
    type: extends
    dimension: feedback
    description: >-
      SEDIMA augments ShinkaEvolve with persistent cross-run insight memory through a write after
      evaluation and a read before mutation. The integrated version keeps the underlying selection,
      population and mutation logic unchanged.
  - from: eoh
    to: adaeva
    type: extends
    dimension: feedback
    description: >-
      AdaEva augments EoH with progressively allocated instance evaluations and early candidate
      elimination. The integration preserves EoH's generator, parent selection and population update
      rules while replacing exhaustive fitness measurement with halving or racing.
  - from: ai-research-teams
    to: coral-discovery
    type: contrasts
    dimension: search
    description: >-
      Both allocate scarce experiments among persistent research agents. AI Research Teams assigns
      credit and discounted-UCB priority to individual researchers. Coral Discovery tracks verified
      mechanism-level directions instead, including an explicit option to open a new direction.
  - from: eoh
    to: evo-bnb
    type: adapts
    dimension: design-object
    description: >-
      Evo-B&B reuses EoH's evolutionary prompt operators to generate joint branching and
      node-selection policies for SCIP. Behavior-aware population management, adaptive operator
      scheduling and selective numerical tuning surround these transferred operators.
  - from: behavesim
    to: openarchevo
    type: contrasts
    dimension: feedback
    description: >-
      BehaveSim measures behavioral differences through complete problem-solving trajectories.
      OpenArchEvo cites this motivation but uses fixed initialization-time responses and architecture
      statistics to compare SNN programs before training, exchanging task-execution evidence for
      cheaper candidate screening.
  - from: when-ai-designs-ai
    to: divalgo
    type: contrasts
    dimension: feedback
    description: >-
      When AI Designs AI measures distance from human methods in reviewed, task-specific module
      coordinates. DivAlgo measures diversity across human and generated solutions with a learned
      code-similarity metric and separate ontology labels. The comparison is interpretable local
      design axes versus a scalable cross-program similarity proxy.
  - from: refineevo
    to: agar
    type: contrasts
    dimension: feedback
    description: >-
      Both revise persistent textual controls for later program mutations. RefineEvo rewrites an
      operator prompt when repeated uses produce invalid code or no improvement. AGAR updates
      modular controller guidelines from rollout feedback, and replaces unconditional rewrites with
      bounded rule edits and delayed validation. The comparison concerns how prompt-level search
      policies are revised and checked, not training the code generator itself.
  - from: epoch-evidence
    to: epi
    type: contrasts
    dimension: feedback
    description: >-
      Both separate a promising score from an accepted research result, but place evidence review
      differently. EPOCH includes challenge, claim support and replay in an explicit admission
      contract, with unresolved checks blocking acceptance. Épi fixes validity and meaningful-gain
      criteria for each campaign and uses a separate model's review to redirect research, while an
      isolated verifier checks the artifact. The distinction is admission control versus directional
      review, not proof versus no proof.
  - from: leanplan
    to: lean-runtime
    type: contrasts
    dimension: search
    description: >-
      Both make Lean proof obligations constrain generated search algorithms, but organize synthesis
      differently. LeanPlan lets a coding agent revise a domain heuristic and admissibility proof,
      then independently rebuilds and tests the final candidate. Lean Runtime uses a prescribed
      sequence of algorithm definitions, structural guards, potential construction and drift
      certificates. This contrasts an open revision loop with staged proof-guided construction,
      without treating optimality and runtime guarantees as interchangeable.
  - from: population-evolution
    to: rldiscover
    type: contrasts
    dimension: feedback
    description: >-
      Both screen executable training-code changes before spending on expensive training. Population
      Evolution's decomposed track requires successful replay on peer subsets and two intermediate
      instances before full-target training. RLDiscover instead promotes by short-training scores
      against a higher-fidelity leader, then increases training steps and repeated seeds on the same
      task. Their promotion evidence tests transfer across data subsets versus ranking reliability
      within a task.
  - from: evoduet
    to: muse
    type: contrasts
    dimension: feedback
    description: >-
      Both gate external evidence before it influences further coding. EvoDuet makes a retrieval
      decision before program mutation, choosing no retrieval, stored documents or a new web-query
      optimization loop. MUSE instead inspects designated tool returns and selectively injects at
      most one source from a frozen experience bank. The comparison concerns the timing and source
      of knowledge intervention, not whether either system has memory.
  - from: rldiscover
    to: comrsi
    type: contrasts
    dimension: feedback
    description: >-
      Both reserve repeated training for promising code candidates, but use that evidence
      differently. RLDiscover selects its final program by the highest observed full-budget fitness
      over repeated seeds. ComRSI tests each candidate against the incumbent on paired validation
      images after three fresh training runs, requiring both a minimum score gain and a positive
      bootstrap lower bound before replacement. This distinguishes ranking by repeated measurements
      from an uncertainty-aware acceptance gate.
  - from: frugalevo
    to: guidance-ttt
    type: contrasts
    dimension: search
    description: >-
      Both separate a proposed design change from its implementation. FrugalEvo assigns strategy
      generation to a fixed expensive model and repeated implementation to a cheaper model.
      Guidance-TTT instead updates a compact guidance model from the rewards of sibling
      implementations while keeping a separate execution model frozen. The contrast is where
      adaptation and model cost are placed within the same strategy-to-code interface.
  - from: trace
    to: adsd
    type: contrasts
    dimension: feedback
    description: >-
      Both turn execution traces into diagnostic knowledge for subsequent solver code. TRACE
      generates schema-specific analysis programs that extract insights or callable surrogates from
      a shared log buffer. ADSD builds literature-grounded probes, verifies diagnostic hypotheses on
      a separate public pool, and audits the methods packaged as solver skills. The contrast is how
      actionable diagnoses acquire evidence, not a claim that either framework inherits the other.
  - from: algoreval
    to: decompgym
    type: contrasts
    dimension: feedback
    description: >-
      AlgoREval's supplementary fidelity audit compares a judge-inferred technique category from a
      task statement with the category found in generated code. DecompGym instead prescribes a
      decomposition contract and audits operative master-subproblem information flow and claimed
      solution status. Both examine method conformance, but inferred category agreement and an
      explicit operational contract establish different kinds of evidence.
  - from: mutation-without-variation
    to: principle-collapse
    type: contrasts
    dimension: feedback
    description: >-
      Mutation Without Variation diagnoses structural contraction through neutral mutation chains,
      accepting every valid proposal and tracking repeated program skeletons. Principle Collapse
      studies selected optimization trajectories and requires retained-principle concentration, a
      prolonged plateau and a gap to an attainable reference before diagnosing harmful locking. The
      contrast separates operator-level contraction from evidence that narrowed search has become
      ineffective.
  - from: strongprior
    to: autonovo
    type: contrasts
    dimension: search
    description: >-
      Both inject expert algorithms to guide program search, but at different representational
      boundaries. StrongPrior supplies executable benchmark code at initialization and periodically
      during evolution. AutoNovo asks an LLM to reconstruct designers from detailed algorithm
      descriptions before ERA refines the resulting code. This contrasts code-grounded priors with
      description-grounded initialization, which also introduces implementation-fidelity risk.
  - from: coral-discovery
    to: holidivevolve
    type: contrasts
    dimension: search
    description: >-
      Both allocate evaluations across ongoing research routes using progress and exploration
      statistics. Coral Discovery groups programs by verified mechanism and gives agents advisory
      direction priorities based on local record gains. HoliDivEvolve directly selects a population
      island using current quality, recent growth, remaining budget and an exploration bonus. The
      key choice is semantic directions independent of code lineage versus explicit evolving program
      pools.
  - from: evopinn
    to: worldsolver
    type: contrasts
    dimension: feedback
    description: >-
      EvoPINN ranks generated PDE-solving algorithms by relative solution error against reference
      values, separately from their physics-informed training loss. WorldSolver evaluates generated
      simulator code through selected physical-law residuals and visual phenomenon criteria without
      comparing against a reference trajectory. This contrasts reference-solution accuracy with
      checked physical and visual properties, not equivalent correctness guarantees or
      interchangeable solver tasks.
  - from: justgoal
    to: autoprofiler
    type: contrasts
    dimension: feedback
    description: >-
      Both address who controls hardware measurement during kernel improvement. JustGoal lets the
      coding agent choose profiling tools and probes within its run. AutoProfiler instead evolves a
      profiling tree offline, then selects metric groups deterministically before a single rewrite.
      This contrasts online discretionary profiling with a reusable, budgeted measurement policy.
  - from: evoduet
    to: ascendevolve
    type: contrasts
    dimension: feedback
    description: >-
      Both retrieve external evidence to address specific gaps encountered during program search.
      EvoDuet evolves web queries and ranks documents by predicted downstream solution gains.
      AscendEvolve routes exact questions into a fixed, version-scoped platform corpus, filters by
      source authority, and lets device evidence override documentation for the current task.
  - from: teacherevo
    to: mosaic-dag
    type: contrasts
    dimension: design-object
    description: >-
      Both use expert action information to improve sequential scheduling decisions. Teacher-Aware
      queries a learned policy on program-visited states and uses disagreements to evolve standalone
      heuristic code. MoSAIC trains its scheduling LLM on CP-SAT next-task traces with motif context
      and refines it with makespan rewards, retaining model inference in the scheduling policy. The
      contrast is teacher-guided program search versus trained runtime action selection.
  - from: tilecas
    to: justgoal
    type: contrasts
    dimension: search
    description: >-
      Both consider when kernel development should leave a high-level representation. TileCas
      explicitly selects an edit action, retained source candidate and abstraction level from mapped
      code and profiling evidence. In JustGoal's GDN case study, the general coding agent decides
      its own progression from Triton to CUDA and hardware-specific tensor-core instructions without
      prescribed stages. This compares explicit abstraction scheduling with agent-directed toolchain
      changes.
  - from: kernaut
    to: bievolve
    type: contrasts
    dimension: feedback
    description: >-
      Both check that changing unrelated batch members does not change a preserved result. Kernaut
      uses purity-constrained covariance components and consistency tests within a numerical
      tolerance under permutation, subsetting, extension and duplication. BIEvolve checks dependencies from
      batch variables into protected GPU mechanisms and requires bitwise output agreement across
      matched batch contexts. This contrasts interface-based purity checks with targeted dependency
      and bitwise checks.
