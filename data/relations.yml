# Directed relations always run from the earlier paper (`from`) to the later paper (`to`).
# `concurrent-work` is undirected and appears as a dashed line on the website.
# Every paper must participate in at least one relation. A paper may declare at
# most two relations (as `to`); later papers may still create additional links to it.
relations:
  - from: ael
    to: funsearch
    type: concurrent-work
    dimension: historical
    description: >-
      AEL and FunSearch independently established LLM-guided evolutionary search
      for algorithm or program design in late 2023.
  - from: ael
    to: eoh
    type: extends
    dimension: design-object
    description: >-
      EoH extends algorithm evolution with a joint representation of
      natural-language ideas and executable heuristic code.
  - from: eoh
    to: eoh-s
    type: generalizes
    dimension: scope
    description: >-
      EoH-S changes the output from one heuristic to a complementary set that
      covers varied instance distributions.
  - from: eoh
    to: ast-evo
    type: extends
    dimension: search
    description: >-
      The AST study replaces EoH's semantic crossover and mutation with structural
      AST disruption followed by LLM repair; it then evaluates this operator in EoH,
      ReEvo, and EoH-S rather than extending the heuristic-set objective itself.
  - from: funsearch
    to: alphaevolve
    type: generalizes
    dimension: scope
    description: >-
      AlphaEvolve broadens evaluator-guided program evolution into a coding-agent
      system for scientific and infrastructure tasks.
  - from: alphaevolve
    to: shinkaevolve
    type: adapts
    dimension: search
    description: >-
      ShinkaEvolve retains island-based program evolution while targeting fewer
      evaluations through novelty rejection, prioritization, and a meta-scratchpad.

  - from: reevo
    to: poh
    type: extends
    dimension: search
    description: >-
      PoH turns ReEvo-style reflective suggestions into actions in an MCTS plan,
      adding lookahead and backpropagated rewards to iterative reflection.
  - from: poh
    to: mcts-ahd
    type: concurrent-work
    dimension: historical
    description: >-
      PoH and MCTS-AHD were contemporaneous tree-search approaches: one plans
      reflective actions, while the other preserves heuristic lineages as nodes.
  - from: mcts-ahd
    to: a2dept
    type: generalizes
    dimension: design-object
    description: >-
      A2DEPT expands tree-structured search from bounded heuristic components to
      complete solver programs with hierarchical edits and dependency repair.
  - from: mcts-ahd
    to: laf-mcts
    type: extends
    dimension: search
    description: >-
      LaF-MCTS applies hierarchical tree search to large-scale CVRP solver design,
      extending the tree-search formulation established by MCTS-AHD.

  - from: hsevo
    to: partevo
    type: extends
    dimension: search
    description: >-
      PartEvo converts the diversity concern highlighted by HSEvo into explicit
      feature-space niches with niche-level search-budget allocation.
  - from: cdeoh
    to: behavesim
    type: contrasts
    dimension: feedback
    description: >-
      CDEoH groups algorithms by semantic categories, whereas BehaveSim measures
      diversity from aligned problem-solving trajectories rather than code form.

  - from: ceoh
    to: a-ceoh
    type: adapts
    dimension: feedback
    description: >-
      CEoH supplies problem-specific context; A-CEoH exposes the surrounding A*
      implementation so generated heuristics can reason about their host algorithm.
  - from: strongprior
    to: knowledgefirst
    type: extends
    dimension: feedback
    description: >-
      Knowledge-first design operationalizes strong priors as retrieved and
      structured domain knowledge that guides proposals before evaluation.

  - from: calm
    to: aad-ft
    type: contrasts
    dimension: feedback
    description: >-
      CALM updates the proposal model online from evolutionary rewards, whereas
      AAD Fine-tuning learns offline from diversity-aware preference pairs.

  - from: llmopt
    to: orlm
    type: contrasts
    dimension: design-object
    description: >-
      LLMOPT learns a shared representation for defining and solving problems;
      ORLM instead trains customizable models on synthesized OR instructions.
  - from: orlm
    to: equivamap
    type: extends
    dimension: feedback
    description: >-
      EquivaMap adds explicit variable mappings and verification for deciding
      whether alternative optimization formulations preserve the same problem.
  - from: optibench
    to: equivamap
    type: extends
    dimension: feedback
    description: >-
      EquivaMap complements outcome-based formulation evaluation with explicit
      variable mappings and structural checks of semantic equivalence.

  - from: eoh
    to: heurigym
    type: evaluated-by
    dimension: feedback
    description: >-
      HeuriGym evaluates EoH-style LLM-crafted heuristics through a shared agentic
      benchmark that separates generation, execution, and task-level scoring.
  - from: ars
    to: afl
    type: generalizes
    dimension: scope
    description: >-
      AFL expands automatic routing design from specializing a solver backbone to
      multi-agent construction and repair of complete constrained VRP solvers.

  - from: g-lns
    to: evolved-alns
    type: generalizes
    dimension: design-object
    description: >-
      Evolved-ALNS broadens generated neighborhood operators into joint evolution
      of the seven interacting modules of an adaptive LNS solver.
  - from: coupleevo
    to: coevo
    type: concurrent-work
    dimension: historical
    description: >-
      CoupleEvo and CoEvo independently study co-evolution for coupled optimization,
      using different representations and coordination mechanisms.
  - from: coevo
    to: stable
    type: generalizes
    dimension: design-object
    description: >-
      STABLE broadens paired component co-evolution into semantics-aware bilevel
      design for reusable multicomponent algorithms.

  - from: eoh-s
    to: raise
    type: contrasts
    dimension: scope
    description: >-
      RAISE targets robust generalization by actively searching adversarial
      instances, whereas EoH-S evaluates complementarity over a fixed diverse pool.

  - from: eoh
    to: autoport
    type: adapts
    dimension: scope
    description: >-
      AutoPort adapts executable heuristic evolution to joint antenna-port selection
      and beamforming under communication-system constraints.
  - from: eoh
    to: llamea-hpo
    type: extends
    dimension: search
    description: >-
      LLaMEA-HPO separates LLM-generated algorithm structure from numerical
      hyper-parameter tuning performed inside the evolutionary loop.
  - from: eoh
    to: teacherevo
    type: extends
    dimension: feedback
    description: >-
      Teacher-Aware evolution adds behavioral guidance from learned optimization
      policies to EoH-like heuristic program search.
  - from: eoh
    to: redahd
    type: extends
    dimension: design-object
    description: >-
      RedAHD builds on EoH-family evolutionary heuristic search while replacing the
      manually supplied algorithm framework with LLM-generated problem reductions.
  - from: eoh
    to: mths
    type: generalizes
    dimension: scope
    description: >-
      MTHS generalizes within-task heuristic evolution into a cross-task hierarchy
      with shared metaheuristics and task-specific executable programs.

  - from: eoh
    to: beam
    type: generalizes
    dimension: design-object
    description: >-
      BEAM expands the design object into a bilevel solver structure, separating
      high-level architecture search from function-level realization.
  - from: eoh
    to: codegraph
    type: extends
    dimension: design-object
    description: >-
      Code Graph replaces whole-candidate inheritance with reusable code subgraphs
      that preserve corrections and partial algorithmic structure across proposals.
  - from: llm-sr
    to: lhs
    type: contrasts
    dimension: search
    description: >-
      LLM-SR searches discrete scientific programs with language-model priors,
      whereas LHS optimizes programs through a learned continuous latent manifold.

  - from: llm4ad-platform
    to: enhancing-cvrp
    type: adapts
    dimension: scope
    description: >-
      AILS-AHD instantiates the platform-style separation of search, task, and
      evaluation modules for ruin-heuristic design inside a CVRP solver.
  - from: eoh
    to: llamea-bo
    type: adapts
    dimension: design-object
    description: >-
      LLaMEA-BO adapts LLM-driven evolutionary design from heuristic functions to
      complete Bayesian optimization algorithm programs.
  - from: eoh
    to: beyond-algorithm-evolution
    type: extends
    dimension: feedback
    description: >-
      Beyond Algorithm Evolution makes the prompt strategy a co-evolving artifact
      alongside the optimization algorithm rather than a fixed search instruction.

  - from: codeevolve
    to: mutation-without-variation
    type: contrasts
    dimension: search
    description: >-
      CodeEvolve combines archives and several LLM variation operators; Mutation
      Without Variation isolates repeated mutation to expose structural attractors.
  - from: reevo
    to: reflex
    type: extends
    dimension: feedback
    description: >-
      REFLEX extends reflective program evolution with visual diagnosis, separated
      code synthesis, and persistent experience memory.

  # Additional lineage links. These give later papers a second, method-specific
  # connection while allowing foundational work to act as a graph hub.
  - from: eoh
    to: ahd-eval
    type: evaluated-by
    dimension: search
    description: >-
      The EPS benchmark isolates the evolutionary-search contribution in EoH-style
      pipelines by comparing evolution against simpler LLM sampling strategies.
  - from: eoh
    to: reevo
    type: extends
    dimension: feedback
    description: >-
      ReEvo augments evolutionary heuristic generation with short- and long-term
      reflective feedback distilled from comparisons between candidate programs.
  - from: eoh
    to: llm4ad-platform
    type: generalizes
    dimension: scope
    description: >-
      LLM4AD turns the EoH workflow into reusable interfaces for methods, problems,
      evaluators, and language models rather than one fixed experiment pipeline.
  - from: eoh
    to: hsevo
    type: evaluated-by
    dimension: search
    description: >-
      HSEvo directly analyzes EoH's exploration behavior, then evaluates harmony
      search and genetic variation as diversity-oriented replacements.
  - from: eoh
    to: meoh
    type: generalizes
    dimension: scope
    description: >-
      MEoH replaces single-objective fitness with Pareto-based evolution so the
      generated heuristics can trade solution quality against computational cost.
  - from: eoh
    to: ceoh
    type: extends
    dimension: feedback
    description: >-
      CEoH injects explicit problem context into the proposal loop, helping the
      model reason about unfamiliar optimization structures before writing code.
  - from: eoh
    to: instspechh
    type: generalizes
    dimension: scope
    description: >-
      InstSpecHH moves from one broadly optimized heuristic to generation and
      selection of specialized heuristics for different instance clusters.
  - from: eoh
    to: heuragenix
    type: generalizes
    dimension: scope
    description: >-
      HeurAgenix expands EoH-style heuristic generation into a portfolio whose
      members are selected online from the current solver state.
  - from: eoh
    to: efficient-heuristics
    type: extends
    dimension: feedback
    description: >-
      Hercules adds elite-structure abstraction and efficiency-oriented feedback
      to iterative LLM heuristic generation.
  - from: eoh
    to: dash
    type: extends
    dimension: feedback
    description: >-
      DASH replaces endpoint-only heuristic scoring with convergence-trajectory
      and runtime profiling to design specialized solver behavior.
  - from: eoh
    to: tide
    type: extends
    dimension: search
    description: >-
      TIDE adds an inner continuous parameter-tuning loop to EoH-style structural
      evolution instead of asking the LLM to optimize both at once.
  - from: eoh
    to: dyace
    type: generalizes
    dimension: scope
    description: >-
      DyACE moves heuristic evolution from a pre-deployment phase into the active
      solution search, redesigning heuristics from observed trajectory features.
  - from: eoh
    to: hmace
    type: extends
    dimension: feedback
    description: >-
      HMACE distributes proposal, critique, and memory across heterogeneous agents
      while retaining population-based heuristic evolution.
  - from: eoh
    to: strongprior
    type: evaluated-by
    dimension: feedback
    description: >-
      Strong Priors tests EoH-family search under richer initial algorithmic
      scaffolds and shows how prior structure changes the value of LLM evolution.

  - from: reevo
    to: calm
    type: extends
    dimension: feedback
    description: >-
      CALM goes beyond textual reflection by updating the proposal model itself
      from evolutionary rewards, coupling model learning with algorithm search.
  - from: reevo
    to: pyvrp-plus
    type: adapts
    dimension: feedback
    description: >-
      PyVRP+ adapts reflective heuristic evolution to a production hybrid genetic
      search, separating diagnosis, hypothesis formation, and code revision.
  - from: reevo
    to: mles
    type: generalizes
    dimension: feedback
    description: >-
      MLES broadens reflection beyond scalar and textual signals by using rendered
      behavior as multimodal feedback for evolving control programs.
  - from: reevo
    to: meevo
    type: extends
    dimension: feedback
    description: >-
      MeEvo makes reflective reasoning heritable across generations and combines it
      with a separate natural-evolution population process.

  - from: calm
    to: ahd-agent
    type: contrasts
    dimension: feedback
    description: >-
      CALM learns the proposal model from evolutionary rewards, whereas AHD Agent
      trains a multi-turn policy for deciding when to inspect, design, and evaluate.

  - from: mcts-ahd
    to: cogmcts
    type: extends
    dimension: search
    description: >-
      CogMCTS adds cognitive guidance and explicit use of failed search experience
      to the lineage-preserving tree search introduced for heuristic evolution.
  - from: mcts-ahd
    to: pathwise
    type: extends
    dimension: search
    description: >-
      PathWise enriches tree-structured planning with a learned world model and
      routed critics that estimate the consequences of design actions.
  - from: meoh
    to: e2oc
    type: generalizes
    dimension: design-object
    description: >-
      E2OC moves multi-objective evolution from selecting whole heuristics to
      jointly designing interdependent operators inside a multi-objective solver.

  - from: funsearch
    to: llm-sr
    type: adapts
    dimension: design-object
    description: >-
      LLM-SR adapts evaluator-guided program search to scientific equation
      discovery, using executable programs as structured symbolic expressions.
  - from: funsearch
    to: codeevolve
    type: generalizes
    dimension: scope
    description: >-
      CodeEvolve generalizes evaluator-driven program evolution into an open coding
      agent with archives, multiple variation operators, and task-defined harnesses.
  - from: alphaevolve
    to: codeevolve
    type: adapts
    dimension: search
    description: >-
      CodeEvolve provides an open implementation of coding-agent evolution with
      configurable archives and operators for reproducible algorithm discovery.
  - from: alphaevolve
    to: cliffsearch
    type: extends
    dimension: design-object
    description: >-
      CliffSearch co-evolves theoretical explanations with code and uses reviewers
      to gate both artifacts, extending discovery beyond executable candidates.
  - from: alphaevolve
    to: harnesseng
    type: evaluated-by
    dimension: feedback
    description: >-
      Vesper studies the harness around coding agents as a primary design variable,
      showing how persistent branches and evaluation structure affect discovery.

  - from: eoh
    to: autosg
    type: generalizes
    dimension: scope
    description: >-
      AutoSG broadens heuristic generation into executable solver construction from
      task prompts under expensive black-box evaluation.
  - from: eoh
    to: ahd-network
    type: adapts
    dimension: scope
    description: >-
      AHD-Network adapts LLM-based heuristic design to noisy production constraints
      in 5G decoding, where each candidate requires costly system evaluation.
