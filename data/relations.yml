# Directed relations always run from the earlier paper (`from`) to the later paper (`to`).
# `concurrent-work` is undirected and appears as a dashed line on the website.
# Every paper must have one or two relations so the map stays connected but readable.
relations:
  - from: ael
    to: funsearch
    type: concurrent-work
    dimension: historical
    description: >-
      AEL and FunSearch independently established LLM-guided evolutionary search
      for algorithm or program design in late 2023.
  - from: ael
    to: eoh
    type: extends
    dimension: design-object
    description: >-
      EoH extends algorithm evolution with a joint representation of
      natural-language ideas and executable heuristic code.
  - from: eoh
    to: eoh-s
    type: generalizes
    dimension: scope
    description: >-
      EoH-S changes the output from one heuristic to a complementary set that
      covers varied instance distributions.
  - from: eoh-s
    to: ast-evo
    type: extends
    dimension: search
    description: >-
      The AST operator permits disruptive structural variation and then repairs
      invalid offspring, expanding the validity-preserving search used by EoH-S.
  - from: funsearch
    to: alphaevolve
    type: generalizes
    dimension: scope
    description: >-
      AlphaEvolve broadens evaluator-guided program evolution into a coding-agent
      system for scientific and infrastructure tasks.
  - from: alphaevolve
    to: shinkaevolve
    type: adapts
    dimension: search
    description: >-
      ShinkaEvolve retains island-based program evolution while targeting fewer
      evaluations through novelty rejection, prioritization, and a meta-scratchpad.

  - from: reevo
    to: poh
    type: extends
    dimension: search
    description: >-
      PoH turns ReEvo-style reflective suggestions into actions in an MCTS plan,
      adding lookahead and backpropagated rewards to iterative reflection.
  - from: poh
    to: mcts-ahd
    type: concurrent-work
    dimension: historical
    description: >-
      PoH and MCTS-AHD were contemporaneous tree-search approaches: one plans
      reflective actions, while the other preserves heuristic lineages as nodes.
  - from: mcts-ahd
    to: a2dept
    type: generalizes
    dimension: design-object
    description: >-
      A2DEPT expands tree-structured search from bounded heuristic components to
      complete solver programs with hierarchical edits and dependency repair.
  - from: a2dept
    to: laf-mcts
    type: contrasts
    dimension: search
    description: >-
      A2DEPT searches explicit program trees, whereas LaF-MCTS uses learned
      language feedback to guide selection and expansion in the search tree.

  - from: hsevo
    to: partevo
    type: extends
    dimension: search
    description: >-
      PartEvo converts the diversity concern highlighted by HSEvo into explicit
      feature-space niches with niche-level search-budget allocation.
  - from: partevo
    to: tide
    type: contrasts
    dimension: search
    description: >-
      PartEvo partitions populations into feature-assisted niches, while TIDE
      coordinates structural diversity with parameter tuning inside evolution.
  - from: tide
    to: cdeoh
    type: contrasts
    dimension: search
    description: >-
      TIDE manages diversity through structural and parameter-level dynamics;
      CDEoH instead preserves coverage over LLM-induced semantic categories.
  - from: cdeoh
    to: behavesim
    type: contrasts
    dimension: feedback
    description: >-
      CDEoH groups algorithms by semantic categories, whereas BehaveSim measures
      diversity from aligned problem-solving trajectories rather than code form.

  - from: ceoh
    to: a-ceoh
    type: adapts
    dimension: feedback
    description: >-
      CEoH supplies problem-specific context; A-CEoH exposes the surrounding A*
      implementation so generated heuristics can reason about their host algorithm.
  - from: strongprior
    to: knowledgefirst
    type: extends
    dimension: feedback
    description: >-
      Knowledge-first design operationalizes strong priors as retrieved and
      structured domain knowledge that guides proposals before evaluation.

  - from: calm
    to: aad-ft
    type: contrasts
    dimension: feedback
    description: >-
      CALM updates the proposal model online from evolutionary rewards, whereas
      AAD Fine-tuning learns offline from diversity-aware preference pairs.
  - from: aad-ft
    to: dyace
    type: contrasts
    dimension: feedback
    description: >-
      AAD Fine-tuning adapts the generator before search; DyACE keeps redesigning
      heuristic logic online from observed search-trajectory features.

  - from: llmopt
    to: orlm
    type: contrasts
    dimension: design-object
    description: >-
      LLMOPT learns a shared representation for defining and solving problems;
      ORLM instead trains customizable models on synthesized OR instructions.
  - from: orlm
    to: equivamap
    type: extends
    dimension: feedback
    description: >-
      EquivaMap adds explicit variable mappings and verification for deciding
      whether alternative optimization formulations preserve the same problem.
  - from: optibench
    to: equivamap
    type: extends
    dimension: feedback
    description: >-
      EquivaMap strengthens formulation evaluation beyond execution outcomes by
      proposing and checking mappings between alternative variable spaces.

  - from: heurigym
    to: afl
    type: concurrent-work
    dimension: design-object
    description: >-
      HeuriGym and AFL independently move from isolated heuristic functions toward
      agentic construction of complete, executable optimization solvers.

  - from: e2oc
    to: g-lns
    type: contrasts
    dimension: design-object
    description: >-
      E2OC co-designs interdependent multi-objective operators, while G-LNS
      generates complementary destroy-and-repair operators for one LNS loop.
  - from: g-lns
    to: evolved-alns
    type: generalizes
    dimension: design-object
    description: >-
      Evolved-ALNS broadens generated neighborhood operators into joint evolution
      of the seven interacting modules of an adaptive LNS solver.
  - from: evolved-alns
    to: coupleevo
    type: contrasts
    dimension: design-object
    description: >-
      Evolved-ALNS decomposes one solver into modules, whereas CoupleEvo divides a
      coupled optimization problem and evolves cooperating subproblem heuristics.
  - from: coupleevo
    to: coevo
    type: concurrent-work
    dimension: historical
    description: >-
      CoupleEvo and CoEvo independently study co-evolution for coupled optimization,
      using different representations and coordination mechanisms.
  - from: coevo
    to: stable
    type: generalizes
    dimension: design-object
    description: >-
      STABLE broadens paired component co-evolution into semantics-aware bilevel
      design for reusable multicomponent algorithms.

  - from: instspechh
    to: raise
    type: contrasts
    dimension: scope
    description: >-
      InstSpecHH partitions observed instances and selects specialized heuristics;
      RAISE instead searches adversarial instances to improve robust generalization.

  - from: hmace
    to: ahd-agent
    type: contrasts
    dimension: feedback
    description: >-
      HMACE assigns proposal and critique to heterogeneous collaborating agents,
      while AHD Agent learns a long-horizon design policy through reinforcement.
  - from: ahd-agent
    to: meevo
    type: contrasts
    dimension: feedback
    description: >-
      AHD Agent learns actions from environment rewards; MeEvo preserves explicit
      metacognitive reasoning as heritable knowledge between evolution cycles.

  - from: ars
    to: autoport
    type: adapts
    dimension: scope
    description: >-
      Both embed generated algorithms in domain solvers; AutoPort transfers the
      pattern from constrained routing to joint antenna-port and beamforming design.
  - from: meoh
    to: llamea-hpo
    type: contrasts
    dimension: search
    description: >-
      MEoH maintains a Pareto set over solution quality and runtime, while
      LLaMEA-HPO separates structural evolution from in-loop parameter tuning.
  - from: mles
    to: teacherevo
    type: contrasts
    dimension: feedback
    description: >-
      MLES reads visual behavior to evolve control programs, whereas Teacher-Aware
      evolution uses learned policies as behavioral teachers for static heuristics.
  - from: harnesseng
    to: pathwise
    type: contrasts
    dimension: search
    description: >-
      Vesper improves persistent coding-agent branches through harness engineering;
      PathWise plans design actions using an explicit world model and routed critics.

  - from: ahd-eval
    to: redahd
    type: contrasts
    dimension: scope
    description: >-
      The EPS benchmark isolates evolutionary search under fixed algorithmic
      frameworks; RedAHD removes the manually supplied framework via reductions.
  - from: redahd
    to: mths
    type: generalizes
    dimension: scope
    description: >-
      MTHS broadens end-to-end heuristic design across tasks by separating a shared
      metaheuristic representation from task-specific executable programs.

  - from: beam
    to: codegraph
    type: contrasts
    dimension: design-object
    description: >-
      BEAM separates high-level solver structure from function realization;
      Code Graph instead stores reusable corrections as composable code subgraphs.
  - from: llm-sr
    to: lhs
    type: contrasts
    dimension: search
    description: >-
      LLM-SR searches discrete scientific programs with language-model priors,
      whereas LHS optimizes programs through a learned continuous latent manifold.

  - from: llm4ad-platform
    to: enhancing-cvrp
    type: adapts
    dimension: scope
    description: >-
      AILS-AHD instantiates the platform-style separation of search, task, and
      evaluation modules for ruin-heuristic design inside a CVRP solver.
  - from: enhancing-cvrp
    to: pyvrp-plus
    type: contrasts
    dimension: feedback
    description: >-
      AILS-AHD evolves ruin heuristics with performance feedback, while PyVRP+
      requires explicit diagnosis, hypothesis formation, and reflection in HGS.

  - from: heuragenix
    to: cogmcts
    type: contrasts
    dimension: search
    description: >-
      HeurAgenix evolves a portfolio and selects by solver state; CogMCTS instead
      organizes iterative heuristic proposals as cognitively guided tree search.
  - from: cogmcts
    to: dash
    type: contrasts
    dimension: feedback
    description: >-
      CogMCTS feeds search history and failed branches back into expansion, whereas
      DASH evaluates complete convergence trajectories and runtime schedules.
  - from: efficient-heuristics
    to: dash
    type: contrasts
    dimension: feedback
    description: >-
      Hercules abstracts shared structure from elite heuristics; DASH retrieves
      profiled solver components according to instance and convergence dynamics.

  - from: llamea-bo
    to: beyond-algorithm-evolution
    type: generalizes
    dimension: feedback
    description: >-
      LLaMEA-BO evolves complete optimization programs under fixed prompts, while
      Beyond Algorithm Evolution makes the guiding prompt a co-evolving artifact.

  - from: codeevolve
    to: mutation-without-variation
    type: contrasts
    dimension: search
    description: >-
      CodeEvolve combines archives and several LLM variation operators; Mutation
      Without Variation isolates repeated mutation to expose structural attractors.
  - from: cliffsearch
    to: reflex
    type: contrasts
    dimension: feedback
    description: >-
      CliffSearch uses scientific reviewers to gate theory-and-code artifacts,
      whereas REFLEX separates visual diagnosis from code synthesis and memory.
  - from: reflex
    to: mutation-without-variation
    type: contrasts
    dimension: search
    description: >-
      REFLEX preserves diagnosed skills across mutations; Mutation Without Variation
      shows why unguided repeated mutation can collapse into recurring structures.

  - from: autosg
    to: ahd-network
    type: adapts
    dimension: scope
    description: >-
      Both address expensive evaluation, and AHD-Network adapts solver-generation
      principles to noisy production constraints in 5G decoding.
